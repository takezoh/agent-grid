format_version: 2
schemas_dir: schemas
lint_targets:
- changes/**/*.md
- design/**/*.md
- adr/*.md
- note/*.md
sqlite_path: index/docs.sqlite
default_change_profile: sdd@1
evidence:
  generated_paths:
  - .run-dev/**
  meta_paths:
  - .gitignore
  # 軽量 issue tracker (issues/README.md) — change scope の対象になる source ではない
  - issues/**
  # dev-docs infrastructure (CLI が維持する tracker meta)
  - docs/.docs-config.yaml
  - docs/aliases.yaml
  - docs/migration/**
