units:
  - title: unit-1-active-lifecycle
    chunk: "1"
    contract_refs:
      - contract-active-recovery-lifecycle
      - contract-daemon-hello-proof
      - contract-active-resource-fence
    files:
      - clients/ui/src/socket/connection.ts
      - clients/ui/src/socket/backoff.ts
      - clients/ui/src/store/daemon.ts
      - clients/ui/src/socket/connection.recovery-regression.test.ts
      - clients/ui/src/socket/connection.test.ts
    acceptance: [UAC-001, UAC-002, UAC-003, UAC-005, UAC-010, UAC-011]
    objective: Implement exact finite, hello-proven, generation-fenced active recovery without changing gateway supervision or old-socket semantics.
    output_format: Production TypeScript plus deterministic T0/T1 tests.
    tool_guidance: Use injected fetch, WebSocket, scheduler, and fake timers; run targeted UI unit tests and typecheck.
    task_boundaries: Do not change gateway wire, retry threshold, transcript replay, or fleet health.
    decision_closure_reason: Public lifecycle and proof semantics are fixed; only private token and scheduler representation are delegated.
  - title: unit-2-host-health
    chunk: "2"
    contract_refs:
      - contract-fleet-health-authority
      - contract-fleet-health-outcomes
      - contract-fleet-resource-lifecycle
      - contract-health-configuration-boundary
    files:
      - clients/workspace/src/main/fleet-session-runtime.ts
      - clients/workspace/src/main/server-health.ts
      - clients/web-host/internal/webhost/fleet.go
      - clients/workspace/tests/fleet-session-runtime.test.ts
      - clients/workspace/tests/server-health.test.ts
      - clients/web-host/internal/webhost/host_test.go
    acceptance: [UAC-007, UAC-012, UAC-013, UAC-014]
    objective: Make existing one-per-host FleetRuntime the sole current/stale health producer with bounded resources and credential-safe projection.
    output_format: Host runtime changes, shared fixture semantics, and deterministic host tests.
    tool_guidance: Reuse existing runtime and health classifiers; use httptest and injected TS transports; add no dependency.
    task_boundaries: Do not add renderer probes, persist health, expose bearer values, or bound host retry at sixteen.
    decision_closure_reason: Accepted fleet ADRs and UX fix authority and outcomes; storage layout remains private.
  - title: unit-3-provider-migration
    chunk: "3"
    contract_refs:
      - contract-fleet-health-authority
      - contract-host-health-wire
      - contract-health-configuration-boundary
    files:
      - clients/ui/src/fleet/provider.ts
      - clients/ui/src/fleet/session-protocol.ts
      - clients/ui/src/fleet/presentation.ts
      - clients/ui/src/fleet/fixtures/fleet-health-v1.json
      - clients/ui/src/auth.ts
      - clients/workspace/src/preload/index.ts
      - clients/workspace/src/main/electron-entry.ts
      - clients/web-host/internal/webhost/host.go
    depends_on: [unit-2-host-health]
    acceptance: [UAC-007, UAC-008, UAC-009, UAC-013, UAC-014]
    objective: Deliver one versioned credential-free health snapshot through both host adapters and one App-level subscription.
    output_format: Flag-day provider/adapter migration plus parity and compatibility tests.
    tool_guidance: Preserve session FleetSnapshot and active channel contracts; test adapter loss and deep-equal normalization.
    task_boundaries: No renderer polling fallback, config reload, or host-kind health semantics.
    decision_closure_reason: Wire meaning and failure behavior are fixed; transport-specific plumbing may differ.
  - title: unit-4-shell-connections
    chunk: "4"
    contract_refs:
      - contract-statusbar-recovery
      - contract-independent-status-axes
      - contract-connections-diagnosis
      - contract-health-configuration-boundary
    files:
      - clients/ui/src/components/StatusBar.tsx
      - clients/ui/src/components/ConnectionsPanel.tsx
      - clients/ui/src/fleet/connections-presentation.ts
      - clients/ui/src/App.tsx
      - clients/ui/src/css/view.css
      - clients/workspace/src/main/settings-page.ts
      - clients/workspace/src/main/app-entry.ts
      - clients/ui/src/components/StatusBar.test.tsx
      - clients/workspace/tests/settings-page.test.ts
    depends_on: [unit-1-active-lifecycle, unit-3-provider-migration]
    acceptance: [UAC-004, UAC-006, UAC-007, UAC-008, UAC-009, UAC-012, UAC-013, UAC-014]
    objective: Present one accessible recovery owner plus independent fleet aggregate and both-host server-qualified diagnosis.
    output_format: Shared React presentation, host navigation wiring, CSS, unit tests, and Playwright assertions.
    tool_guidance: Prefer native button/status semantics and existing settings delivery; inspect roles, focus, keyboard, and normalized rows.
    task_boundaries: Connections must not own Retry; no toast/modal recovery, health persistence, or browser credential mutation API.
    decision_closure_reason: Observable action names, contents, and modality are fixed; layout is private discretion.
  - title: unit-5-integration-verification
    chunk: "5"
    contract_refs:
      - contract-active-recovery-lifecycle
      - contract-daemon-hello-proof
      - contract-fleet-health-authority
      - contract-host-health-wire
      - contract-connections-diagnosis
    files:
      - clients/ui/e2e
      - clients/ui/e2e-real
      - clients/workspace/tests
      - clients/web-host/internal/webhost
      - services/server/api
      - docs/changes/change-20260727-resilient-server-reconnect-health
    depends_on: [unit-1-active-lifecycle, unit-2-host-health, unit-3-provider-migration, unit-4-shell-connections]
    acceptance:
      - All UAC-001 through UAC-014 pass against applicable browser and Workspace boundaries.
      - Fake, invariant contract, and FakeVsReal backstop are present for modified gateway-facing fakes.
    objective: Close cross-boundary mechanical gates and materialize accepted ADR/design promotion evidence.
    output_format: Passing verification evidence and change-package documentation updates.
    tool_guidance: Run targeted gates first, then affected lint/typecheck, browser smoke, real-stack, host tests, and gateway tests.
    task_boundaries: Do not weaken FakeVsReal assertions or claim manual/T3 evidence that was not run.
    decision_closure_reason: No implementation choice remains; this unit gathers discriminating closure evidence.
acceptance:
  - id: UAC-001
    criteria: Established disconnect remains reconnecting until a later daemon hello and then recovers without Retry or reload.
    requirement_refs: [FR-REC-001, FR-REC-002]
  - id: UAC-002
    criteria: WebSocket open without current-generation hello never presents nominal recovery whether it remains open or closes.
    requirement_refs: [FR-REC-002]
  - id: UAC-003
    criteria: One Retry activation starts one fresh lifecycle and only later hello completes recovery.
    requirement_refs: [FR-REC-003]
  - id: UAC-004
    criteria: With no session, pointer, keyboard, and assistive-technology users can perceive and activate Retry with stable focus continuity.
    requirement_refs: [FR-REC-003, FR-REC-004]
  - id: UAC-005
    criteria: Exactly sixteen automatic retries follow the initiating failure and no seventeenth is scheduled.
    requirement_refs: [FR-REC-001]
  - id: UAC-006
    criteria: StatusBar is the sole visible and assistive-technology recovery/Retry owner and Connections has no duplicate Retry.
    requirement_refs: [FR-REC-004]
  - id: UAC-007
    criteria: Partial degradation distinguishes unavailable and incompatible counts over enabled total and excludes disabled entries.
    requirement_refs: [FR-FLEET-002, FR-FLEET-003]
  - id: UAC-008
    criteria: Connections is keyboard/pointer reachable in both hosts and shows each configured server with qualified state and available reason while config editing remains usable.
    requirement_refs: [FR-FLEET-003, NFR-HOST-001]
  - id: UAC-009
    criteria: Active hello clears active recovery while another member's fleet degradation and Connections remain visible.
    requirement_refs: [FR-FLEET-004]
  - id: UAC-010
    criteria: Initial unavailability before any hello progresses through exact exhaustion to closed with Retry even without a session.
    requirement_refs: [FR-REC-001, FR-REC-004]
  - id: UAC-011
    criteria: Exhausted manual lifecycle returns to reusable Retry without reload or permanent disablement.
    requirement_refs: [FR-REC-003]
  - id: UAC-012
    criteria: All enabled servers unavailable produces explicit total-outage wording and Connections identifies every configured server.
    requirement_refs: [FR-FLEET-002, FR-FLEET-003]
  - id: UAC-013
    criteria: Failed health refresh or delivery shows Health unavailable and any retained Connected evidence is explicitly stale while configuration remains editable.
    requirement_refs: [FR-FLEET-002, FR-FLEET-003]
  - id: UAC-014
    criteria: A current all-enabled-healthy revision clears aggregate degradation without altering independently correct active connection state.
    requirement_refs: [FR-FLEET-002, FR-FLEET-004]
dispositions:
  - decision_input_ref: decision-input-recovery-policy
    disposition: Adopt exact one initiating attempt plus sixteen automatic retries, then reusable manual Retry.
    contract_refs: [contract-active-recovery-lifecycle]
  - decision_input_ref: decision-input-recovery-proof
    disposition: Adopt current-generation daemon hello as the only recovery proof.
    contract_refs: [contract-daemon-hello-proof]
  - decision_input_ref: decision-input-status-owner
    disposition: Adopt persistent StatusBar as sole active-recovery and Retry owner.
    contract_refs: [contract-statusbar-recovery]
  - decision_input_ref: decision-input-fleet-denominator
    disposition: Aggregate enabled configured entries only and retain disabled entries only in diagnosis.
    contract_refs: [contract-fleet-health-outcomes, contract-independent-status-axes]
  - decision_input_ref: decision-input-health-boundary
    disposition: Keep health runtime-only and separate from immutable configuration persistence.
    contract_refs: [contract-health-configuration-boundary]
  - decision_input_ref: decision-input-diagnosis-entry
    disposition: Provide a consistently named Connections action and server-qualified diagnosis in both hosts.
    contract_refs: [contract-connections-diagnosis]
  - decision_input_ref: decision-input-retry-reachability
    disposition: Close through persistent no-session StatusBar, native Retry, generation single-flight, and focus verification.
    contract_refs: [contract-statusbar-recovery, contract-active-recovery-lifecycle]
  - decision_input_ref: decision-input-status-announcement
    disposition: Use dedicated polite status text with Retry as a sibling action and focus the fixed persistent StatusBar landmark only when focused Retry disappears.
    contract_refs: [contract-statusbar-recovery]
  - decision_input_ref: decision-input-runtime-health-boundary
    disposition: Extend the existing one host FleetRuntime as sole host health writer and propose a complementary projection/delivery-overlay ADR that cannot create a second owner.
    adr_refs: [adr-20260803-resilient-fleet-health-single-authority]
    contract_refs: [contract-fleet-health-authority, contract-health-configuration-boundary]
  - decision_input_ref: decision-input-shared-connections
    disposition: Share one pure row/label/reason projection and permit only host navigation/rendering differences.
    adr_refs: [adr-20260803-resilient-fleet-health-single-authority]
    contract_refs: [contract-host-health-wire, contract-connections-diagnosis]
  - decision_input_ref: decision-input-adr-0011
    disposition: Preserve two-step daemon-disconnected control plus typed close and create a new client socket.
    adr_refs: [adr-20260624-0011-two-step-ws-close-on-daemon-disconnect]
    contract_refs: [contract-active-recovery-lifecycle, contract-daemon-hello-proof]
  - decision_input_ref: decision-input-adr-0012
    disposition: Preserve eager unbounded gateway daemon supervision outside the finite shared-UI lifecycle.
    adr_refs: [adr-20260624-0012-daemon-client-eager-dial-supervisor]
    contract_refs: [contract-active-recovery-lifecycle]
  - decision_input_ref: decision-input-adr-0022
    disposition: Preserve only frame-not-ready subscribe retry and reusable backoff mechanics; this change owns active lifecycle count, proof, and fencing.
    adr_refs: [adr-20260624-0022-subscribe-retry-in-socket-layer]
    contract_refs: [contract-active-recovery-lifecycle]
  - decision_input_ref: decision-input-adr-host-neutral
    disposition: Add equal credential-free health meaning to both FleetProvider host adapters.
    adr_refs: [adr-20260727-host-neutral-fleet-provider, adr-20260803-resilient-fleet-health-single-authority]
    contract_refs: [contract-fleet-health-authority, contract-host-health-wire, contract-connections-diagnosis]
  - decision_input_ref: decision-input-adr-app-fleet
    disposition: Reuse the existing one-per-host FleetRuntime rather than adding view or Settings health authorities.
    adr_refs: [adr-20260727-application-scoped-fleet-session-authority, adr-20260803-resilient-fleet-health-single-authority]
    contract_refs: [contract-fleet-health-authority]
  - decision_input_ref: decision-input-adr-partial-failure
    disposition: Preserve compound server identity, latest-generation wins, stale retention, and healthy-member usability.
    adr_refs: [adr-20260727-server-qualified-identity-partial-failure]
    contract_refs: [contract-fleet-health-authority, contract-fleet-health-outcomes]
  - decision_input_ref: decision-input-adr-auth
    disposition: Keep credentials host-owned and exclude bearer values and raw secret-bearing errors from health projection.
    adr_refs: [adr-20260727-single-user-server-auth]
    contract_refs: [contract-health-configuration-boundary]
  - decision_input_ref: decision-input-adr-exact-protocol
    disposition: Preserve exact-match admission; mismatch is Incompatible protocol and terminal for member operational/reconnect work until config or process generation changes.
    adr_refs: [adr-20260727-exact-match-client-server-protocol]
    contract_refs: [contract-fleet-health-authority, contract-fleet-health-outcomes]
  - decision_input_ref: decision-input-testing-policy
    disposition: Require feature tests plus fake, invariant contract, and FakeVsReal backstop for modified external gateway seams.
    contract_refs: [contract-daemon-hello-proof, contract-fleet-health-authority, contract-host-health-wire]
  - decision_input_ref: issue-exact-match-protocol-adr-omitted
    disposition: Resolved by tracing the exact-match ADR and making protocol mismatch terminal Incompatible protocol with no retry in the member generation.
    adr_refs: [adr-20260727-exact-match-client-server-protocol]
    contract_refs: [contract-fleet-health-authority, contract-fleet-health-outcomes]
  - decision_input_ref: issue-fleet-authority-double-owner
    disposition: Resolved by retaining FleetRuntime as the sole writer; the complementary ADR fixes projection and delivery-overlay semantics without creating an authority.
    adr_refs: [adr-20260727-application-scoped-fleet-session-authority, adr-20260803-resilient-fleet-health-single-authority]
    contract_refs: [contract-fleet-health-authority, contract-host-health-wire]
  - decision_input_ref: issue-delivery-failure-owner-gap
    disposition: Resolved with a provider-owned liveness overlay that preserves and never advances the last host revision.
    contract_refs: [contract-host-health-wire]
  - decision_input_ref: issue-health-refresh-lifecycle-undefined
    disposition: Resolved with five-second Connected freshness, bounded refresh, stale prior retention on failure, and later current recovery.
    contract_refs: [contract-fleet-health-outcomes, contract-fleet-resource-lifecycle]
  - decision_input_ref: issue-active-attempt-generation-race
    disposition: Resolved with separate lifecycle generation and per-attempt sequence checked by every asynchronous continuation.
    contract_refs: [contract-active-recovery-lifecycle, contract-active-resource-fence]
  - decision_input_ref: issue-health-wire-schema-owner-missing
    disposition: Resolved by making session-protocol.ts the schema/decoder owner and canonical JSON fixtures the cross-codec conformance input.
    contract_refs: [contract-host-health-wire]
  - decision_input_ref: issue-health-state-invalid-combinations
    disposition: Resolved with an exclusive qualified observation union and codec rejection of invalid combinations.
    contract_refs: [contract-fleet-health-outcomes, contract-host-health-wire]
  - decision_input_ref: issue-status-live-region-interaction-conflict
    disposition: Resolved with sibling live text and Retry plus one fixed persistent StatusBar focus landmark.
    contract_refs: [contract-statusbar-recovery]
  - decision_input_ref: issue-test-closure-nonexecuting
    disposition: Resolved with owning-package T0/T1 commands and the executable FakeVsRealFleetHealth T3 gate.
    contract_refs: [contract-fleet-health-authority, contract-host-health-wire, contract-connections-diagnosis]
  - decision_input_ref: issue-connections-semantics-split-owner
    disposition: Resolved with one pure connections-presentation projection consumed by both host renderers.
    contract_refs: [contract-connections-diagnosis]
  - decision_input_ref: issue-adr-0022-overclaimed
    disposition: Resolved by narrowing ADR 0022 to frame-not-ready subscribe retry and reusable backoff mechanics.
    adr_refs: [adr-20260624-0022-subscribe-retry-in-socket-layer]
    contract_refs: [contract-active-recovery-lifecycle]
  - decision_input_ref: issue-security-redaction-boundary-unverifiable
    disposition: Resolved with producer-side closed classifiers before snapshot/log boundaries and sentinel tests for wire, DOM, config, and logs.
    contract_refs: [contract-health-configuration-boundary]
  - decision_input_ref: issue-resource-progress-bounds-incomplete
    disposition: Resolved by bounding capabilities, ticket, and hello phases to three seconds and making shutdown handle convergence deterministic.
    contract_refs: [contract-fleet-resource-lifecycle]
  - decision_input_ref: issue-browser-editability-outcome-weakened
    disposition: Resolved with keyboard-operable browser configuration-path copy and restart instruction that remain available during health failure.
    contract_refs: [contract-connections-diagnosis]
