artifact: design-plan-spine
version: 1
granularity_profile: boundary-complete
requirements:
  - id: FR-REC-001
    type: functional
    priority: must
    statement: When an initiating connection fails or a hello-confirmed connection closes unexpectedly, the shared UI shall run no more than sixteen automatic retries and then expose closed with Retry.
  - id: FR-REC-002
    type: invariant
    priority: must
    statement: The active connection shall never publish nominal or recovered state before a daemon-derived hello from the current lifecycle generation.
  - id: FR-REC-003
    type: functional
    priority: must
    statement: Retry shall start exactly one fresh reload-free lifecycle with fresh accounting and shall become reusable after another exhaustion.
  - id: FR-REC-004
    type: invariant
    priority: must
    statement: The persistent StatusBar shall be the only active-recovery and Retry owner and shall preserve no-session, keyboard, pointer, assistive-technology, and focus reachability.
  - id: FR-FLEET-001
    type: invariant
    priority: must
    statement: Exactly one host FleetRuntime shall own enabled-member health generation and runtime-only publication; views shall not probe or persist health.
  - id: FR-FLEET-002
    type: functional
    priority: must
    statement: Every configured server shall have exactly one exclusive qualified observation; exact protocol mismatch is terminal for that member generation and Health unavailable may retain only a nested stale prior observation.
  - id: FR-FLEET-003
    type: functional
    priority: must
    statement: Degraded enabled-fleet health shall produce correct partial or total wording and Connections diagnosis in both hosts, including an operable browser configuration-path copy action and restart instruction.
  - id: FR-FLEET-004
    type: invariant
    priority: must
    statement: Active connection status and fleet aggregate status shall remain independent so recovery of one axis cannot erase degradation on the other.
  - id: NFR-LIFE-001
    type: non_functional
    priority: must
    statement: Retired active and host-member generations shall release or fence fetches, timers, sockets, channels, callbacks, pending requests, and publication.
  - id: NFR-HEALTH-001
    type: non_functional
    priority: must
    statement: Capabilities, ticket, and hello phases shall each terminate within three seconds; Connected evidence expires after five seconds, and concurrent/render consumers reuse one host snapshot without multiplying work.
  - id: NFR-HOST-001
    type: non_functional
    priority: must
    statement: Web and Workspace shall normalize equal evidence to equal credential-free health meaning while differing only in delivery transport.
  - id: NFR-TEST-001
    type: non_functional
    priority: must
    statement: Lifecycle races, host parity, and external gateway evidence shall have deterministic fake, invariant-contract, and FakeVsReal verification seams.
components:
  - id: component-active-connection
    kind: existing
    contract_refs:
      - contract-active-recovery-lifecycle
      - contract-daemon-hello-proof
      - contract-active-resource-fence
    paths:
      - clients/ui/src/socket/connection.ts
      - clients/ui/src/socket/backoff.ts
      - clients/ui/src/store/daemon.ts
  - id: component-status-bar
    kind: existing
    contract_refs:
      - contract-statusbar-recovery
      - contract-independent-status-axes
    paths:
      - clients/ui/src/components/StatusBar.tsx
      - clients/ui/src/App.tsx
      - clients/ui/src/css/view.css
  - id: component-host-fleet-runtime
    kind: existing
    contract_refs:
      - contract-fleet-health-authority
      - contract-fleet-health-outcomes
      - contract-fleet-resource-lifecycle
    paths:
      - clients/workspace/src/main/fleet-session-runtime.ts
      - clients/workspace/src/main/server-health.ts
      - clients/web-host/internal/webhost/fleet.go
  - id: component-fleet-provider
    kind: existing
    contract_refs:
      - contract-host-health-wire
      - contract-health-configuration-boundary
    paths:
      - clients/ui/src/fleet/provider.ts
      - clients/ui/src/fleet/session-protocol.ts
      - clients/ui/src/fleet/presentation.ts
      - clients/ui/src/auth.ts
      - clients/workspace/src/preload/index.ts
      - clients/web-host/internal/webhost/host.go
  - id: component-connections-surface
    kind: planned
    contract_refs:
      - contract-connections-diagnosis
    paths:
      - clients/ui/src/components/ConnectionsPanel.tsx
      - clients/ui/src/fleet/connections-presentation.ts
      - clients/workspace/src/main/settings-page.ts
      - clients/workspace/src/main/app-entry.ts
      - clients/web-host/internal/webhost/host.go
  - id: component-gateway-evidence
    kind: existing
    contract_refs: []
    paths:
      - services/server/api
contracts:
  - id: contract-active-recovery-lifecycle
    dimension: state_lifecycle
    owner: component-active-connection
    requirement_refs: [FR-REC-001, FR-REC-003, NFR-LIFE-001]
    unit_refs: [unit-1-active-lifecycle]
    adr_refs:
      - adr-20260624-0011-two-step-ws-close-on-daemon-disconnect
      - adr-20260624-0012-daemon-client-eager-dial-supervisor
      - adr-20260624-0022-subscribe-retry-in-socket-layer
    verification:
      - {id: verify-active-retry-exact, tier: T0, command: "cd clients/ui && npm run test:unit -- src/socket/connection.recovery-regression.test.ts"}
      - {id: verify-initial-recovery-stop, tier: T1, command: "cd clients/ui && npm run test:unit -- src/socket/connection.test.ts"}
      - {id: verify-manual-retry-repeat, tier: T1, command: "cd clients/ui && npm run test:unit -- src/socket/connection.recovery-regression.test.ts"}
      - {id: verify-stale-generation-noop, tier: T1, command: "cd clients/ui && npm run test:unit -- src/socket/connection.test.ts"}
    discretion:
      - id: discretion-active-generation-token
        question: Which private lifecycle token representation fences active connection work?
        scope:
          files: [clients/ui/src/socket/connection.ts]
          component: component-active-connection
          visibility: private
        escalate_when:
          - The choice changes attempt counting, hello proof, the store API, or permits more than one live active resource.
        constraints:
          - Every asynchronous continuation checks current lifecycle authority.
        preserves:
          contract_refs: [contract-active-recovery-lifecycle, contract-active-resource-fence]
          invariant_refs: [FR-REC-002, NFR-LIFE-001]
        verification_refs: [verify-active-retry-exact, verify-stale-generation-noop]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: lifecycle
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-daemon-hello-proof
    dimension: integration_contract
    owner: component-active-connection
    requirement_refs: [FR-REC-002]
    unit_refs: [unit-1-active-lifecycle]
    adr_refs: [adr-20260624-0011-two-step-ws-close-on-daemon-disconnect]
    verification:
      - {id: verify-hello-only-open, tier: T0, command: "cd clients/ui && npm run test:unit -- src/socket/connection.recovery-regression.test.ts"}
      - {id: verify-open-without-hello, tier: T1, command: "cd clients/ui && npm run test:unit -- src/socket/connection.test.ts"}
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: Unknown or malformed/non-hello evidence remains non-nominal; only a valid current-generation hello is determinate recovery.
  - id: contract-active-resource-fence
    dimension: resource_management
    owner: component-active-connection
    requirement_refs: [FR-REC-003, NFR-LIFE-001]
    unit_refs: [unit-1-active-lifecycle]
    verification:
      - {id: verify-active-resource-closure, tier: T1, command: "cd clients/ui && npm run test:unit -- src/socket/connection.test.ts"}
      - {id: verify-single-flight-retry, tier: T0, command: "cd clients/ui && npm run test:unit -- src/socket/connection.recovery-regression.test.ts"}
    discretion:
      - id: discretion-cancelable-scheduler
        question: How should the private retry scheduler expose cancellation to Connection?
        scope:
          files: [clients/ui/src/socket/connection.ts, clients/ui/src/socket/backoff.ts]
          component: component-active-connection
          visibility: private
        escalate_when:
          - Deterministic tests cannot prove timer/resource release or generation fencing without wall-clock waits.
        constraints:
          - Correctness cannot depend solely on fetch or timer cancellation support.
        preserves:
          contract_refs: [contract-active-resource-fence]
          invariant_refs: [NFR-LIFE-001]
        verification_refs: [verify-active-resource-closure]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: concurrency
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-statusbar-recovery
    dimension: user_observability
    owner: component-status-bar
    requirement_refs: [FR-REC-003, FR-REC-004]
    unit_refs: [unit-4-shell-connections]
    verification:
      - {id: verify-statusbar-retry-access, tier: T1, command: "cd clients/ui && npm run test:unit -- src/components/StatusBar.test.tsx"}
      - {id: verify-status-announcement-focus, tier: T1, command: "cd clients/ui && npm run test:e2e"}
      - {id: verify-single-recovery-owner, tier: T0, command: "cd clients/ui && npm run test:unit -- src/components/StatusBar.test.tsx src/App.test.tsx"}
    discretion:
      - id: discretion-status-focus-implementation
        question: Which private ref/effect plumbing focuses the fixed persistent StatusBar landmark when focused Retry disappears?
        scope:
          files: [clients/ui/src/components/StatusBar.tsx, clients/ui/src/App.tsx]
          component: component-status-bar
          visibility: private
        escalate_when:
          - The destination changes, a visible recovery surface is added, a non-Retry transition steals focus, or the landmark is not perceivable by keyboard and assistive technology.
        preserves:
          contract_refs: [contract-statusbar-recovery]
          invariant_refs: [FR-REC-004]
        verification_refs: [verify-status-announcement-focus]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: component
          context_scope: component
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: normal
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-fleet-health-authority
    dimension: integration_contract
    owner: component-host-fleet-runtime
    requirement_refs: [FR-FLEET-001, FR-FLEET-002, NFR-HOST-001, NFR-TEST-001]
    unit_refs: [unit-2-host-health, unit-3-provider-migration]
    adr_refs:
      - adr-20260727-host-neutral-fleet-provider
      - adr-20260727-application-scoped-fleet-session-authority
      - adr-20260727-server-qualified-identity-partial-failure
      - adr-20260727-exact-match-client-server-protocol
      - adr-20260803-resilient-fleet-health-single-authority
    verification:
      - {id: verify-single-host-health-writer, tier: T0, command: "cd clients/workspace && npm run test:unit -- tests/fleet-session-runtime.test.ts tests/server-health.test.ts"}
      - {id: verify-cross-host-health-conformance, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/fleet-session-runtime.test.ts tests/fleet-health-wire.test.ts"}
      - {id: verify-generation-fence, tier: T1, command: "cd clients/web-host && go test ./..."}
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: One full host revision contains every configured identity; newest host generation wins, exact mismatch is terminal, and adapter delivery loss is a consumer overlay that cannot advance host revision.
    discretion:
      - id: discretion-health-storage
        question: Should private health state extend existing member records or use a parallel map before projection?
        scope:
          files: [clients/workspace/src/main/fleet-session-runtime.ts, clients/web-host/internal/webhost/fleet.go]
          component: component-host-fleet-runtime
          visibility: private
        escalate_when:
          - Session membership and health gain different generation owners or normalized host snapshots differ.
        preserves:
          contract_refs: [contract-fleet-health-authority, contract-fleet-health-outcomes]
          invariant_refs: [FR-FLEET-001]
        verification_refs: [verify-cross-host-health-conformance, verify-generation-fence]
        difficulty_inputs:
          decision_reasoning: multi_constraint
          boundary_reach: component
          context_scope: component
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: concurrency
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-fleet-health-outcomes
    dimension: failure_recovery
    owner: component-host-fleet-runtime
    requirement_refs: [FR-FLEET-002, FR-FLEET-004]
    unit_refs: [unit-2-host-health, unit-4-shell-connections]
    adr_refs:
      - adr-20260727-exact-match-client-server-protocol
      - adr-20260803-resilient-fleet-health-single-authority
    verification:
      - {id: verify-health-outcome-partition, tier: T0, command: "cd clients/workspace && npm run test:unit -- tests/server-health.test.ts"}
      - {id: verify-stale-never-current, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/fleet-session-runtime.test.ts"}
      - {id: verify-total-outage, tier: T1, command: "cd clients/ui && npm run test:unit -- src/fleet/presentation.test.ts"}
      - {id: verify-fleet-recovery, tier: T1, command: "cd clients/ui && npm run test:unit -- src/components/StatusBar.test.tsx"}
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: The exclusive union admits current Checking/Connected/Unavailable/Incompatible, freshness-free Disabled, or Health unavailable with optional nested stale prior; protocol mismatch is terminal and delivery overlay is not host evidence.
  - id: contract-fleet-resource-lifecycle
    dimension: performance_budget
    owner: component-host-fleet-runtime
    requirement_refs: [NFR-LIFE-001, NFR-HEALTH-001]
    unit_refs: [unit-2-host-health]
    verification:
      - {id: verify-health-singleflight, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/server-health.test.ts"}
      - {id: verify-health-three-second-bound, tier: T0, command: "cd clients/workspace && npm run test:unit -- tests/server-health.test.ts tests/fleet-session-runtime.test.ts"}
      - {id: verify-health-resource-closure, tier: T1, command: "cd clients/web-host && go test ./internal/webhost -run 'TestFleetHealthTimeout|TestFleetHealthShutdown'"}
  - id: contract-host-health-wire
    dimension: migration_compatibility
    owner: component-fleet-provider
    requirement_refs: [FR-FLEET-001, FR-FLEET-002, NFR-HOST-001]
    unit_refs: [unit-3-provider-migration]
    adr_refs:
      - adr-20260727-host-neutral-fleet-provider
      - adr-20260727-application-scoped-fleet-session-authority
      - adr-20260803-resilient-fleet-health-single-authority
    verification:
      - {id: verify-health-wire-parity, tier: T1, command: "cd clients/ui && npm run test:unit -- src/fleet/provider.test.ts src/fleet/session-protocol.test.ts"}
      - {id: verify-session-wire-compat, tier: T1, command: "cd clients/ui && npm run test:unit -- src/fleet/session-protocol.test.ts"}
      - {id: verify-health-delivery-loss, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/fleet-session-runtime.test.ts"}
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: Valid delivery publishes monotonic current-instance host revisions; startup absence is Checking and broken delivery overlays Health unavailable while preserving the last host revision and forbidding renderer probing fallback.
  - id: contract-independent-status-axes
    dimension: user_observability
    owner: component-status-bar
    requirement_refs: [FR-FLEET-003, FR-FLEET-004]
    unit_refs: [unit-4-shell-connections]
    verification:
      - {id: verify-independent-status-axes, tier: T1, command: "cd clients/ui && npm run test:unit -- src/components/StatusBar.test.tsx"}
      - {id: verify-enabled-denominator, tier: T0, command: "cd clients/ui && npm run test:unit -- src/fleet/presentation.test.ts"}
      - {id: verify-fleet-summary-exits, tier: T1, command: "cd clients/ui && npm run test:unit -- src/components/StatusBar.test.tsx"}
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Active and fleet inputs are reduced independently; unknown or inconclusive fleet evidence is non-nominal and never erased by active hello.
  - id: contract-connections-diagnosis
    dimension: integration_contract
    owner: component-connections-surface
    requirement_refs: [FR-FLEET-003]
    unit_refs: [unit-4-shell-connections]
    adr_refs: [adr-20260727-host-neutral-fleet-provider]
    verification:
      - {id: verify-connections-parity, tier: T1, command: "cd clients/ui && npm run test:unit -- src/fleet/connections-presentation.test.ts src/components/ConnectionsPanel.test.tsx"}
      - {id: verify-browser-connections-reachability, tier: T1, command: "cd clients/ui && npm run test:e2e"}
      - {id: verify-workspace-connections-editable, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/settings-page.test.ts"}
      - {id: verify-connections-no-retry, tier: T0, command: "cd clients/ui && npm run test:unit -- src/components/StatusBar.test.tsx src/components/ConnectionsPanel.test.tsx"}
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: Every configured identity remains visible; absent current health is Health unavailable rather than omission and Connections never becomes a Retry owner.
    discretion:
      - id: discretion-connections-layout
        question: Should the shared diagnosis be presented as a panel, drawer, or route?
        scope:
          files: [clients/ui/src/components/ConnectionsPanel.tsx, clients/ui/src/App.tsx]
          component: component-connections-surface
          visibility: private
        escalate_when:
          - Action name, server-qualified contents, modality reachability, configuration editability, or the no-duplicate-Retry contract changes.
        preserves:
          contract_refs: [contract-connections-diagnosis]
          invariant_refs: [FR-REC-004]
        verification_refs: [verify-browser-connections-reachability, verify-connections-no-retry]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: component
          context_scope: component
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: normal
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-health-configuration-boundary
    dimension: security_boundary
    owner: component-fleet-provider
    requirement_refs: [FR-FLEET-001, FR-FLEET-002, NFR-HOST-001]
    unit_refs: [unit-2-host-health, unit-3-provider-migration, unit-4-shell-connections]
    adr_refs: [adr-20260727-single-user-server-auth]
    verification:
      - {id: verify-health-secret-redaction, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/server-health.test.ts tests/fleet-health-wire.test.ts"}
      - {id: verify-health-not-persisted, tier: T1, command: "cd clients/workspace && npm run test:unit -- tests/desktop-config.test.ts tests/settings-page.test.ts"}
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Host credential/config authority wins; conflicting or unsanitized evidence is rejected and health never enters config persistence.
