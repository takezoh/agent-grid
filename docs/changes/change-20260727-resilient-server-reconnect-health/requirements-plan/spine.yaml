flows:
  - id: F-001
    goal_refs: [goal-recover-work]
    experience_contract_refs: [exp-recovery-continuity]
    experience_closure_reason: Initial and established-connection failures have fixed progress, hello-confirmed success, exact exhaustion, and manual recovery exits.
    acceptance_scenario_refs: [UAC-001, UAC-002, UAC-005, UAC-010]
  - id: F-002
    goal_refs: [goal-recover-work]
    experience_contract_refs: [exp-recovery-continuity]
    experience_closure_reason: Manual recovery fixes activation, success, repeated failure, no-session reachability, modality equivalence, focus continuity, and single ownership.
    acceptance_scenario_refs: [UAC-003, UAC-004, UAC-006, UAC-011]
  - id: F-003
    goal_refs: [goal-diagnose-fleet, goal-recover-work]
    experience_contract_refs: [exp-fleet-health-legibility, exp-recovery-continuity]
    experience_closure_reason: Partial and total degradation, both-host diagnosis, stale evidence, independent active recovery, and nominal fleet recovery have fixed observations.
    acceptance_scenario_refs: [UAC-007, UAC-008, UAC-009, UAC-012, UAC-013, UAC-014]
