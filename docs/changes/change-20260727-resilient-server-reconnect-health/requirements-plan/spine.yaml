  - {behavior: Manual page reload is the only client recovery after daemon restart or initial unavailability., scenario_refs: [UAC-001, UAC-003, UAC-004, UAC-010, UAC-011]}
  - {behavior: An exhausted client connection path has no explicit status-bar Retry action., scenario_refs: [UAC-005, UAC-010, UAC-011]}
  - {behavior: Active connection failure may be presented by duplicate shell surfaces., scenario_refs: [UAC-006]}
  - {behavior: "When an enabled server was unavailable or protocol-incompatible, the legacy workspace showed neither an enabled-server aggregate condition in the status bar nor each configured server's current health and available reason in Connections.", scenario_refs: [UAC-007, UAC-008, UAC-009, UAC-012, UAC-013, UAC-014]}
