    - Manual page reload is the only client recovery after daemon restart or initial unavailability.
    - An exhausted client connection path has no explicit status-bar Retry action.
    - Active connection failure may be presented by duplicate shell surfaces.
    - "When an enabled server was unavailable or protocol-incompatible, the legacy workspace showed neither an enabled-server aggregate condition in the status bar nor each configured server's current health and available reason in Connections."
