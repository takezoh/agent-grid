assumptions:
  - id: assumption-status-bar-no-session-reachability
    validation: Validate in the assembled shell that the status bar and Retry remain visible and operable when no session is selected.
    invalidation_behavior: Repair shell composition if the no-session state hides or disables the status bar or Retry; do not weaken UAC-004 or UAC-010.
    scenario_refs: [UAC-004, UAC-010]
  - id: assumption-status-text-focus-continuity
    validation: Validate in the assembled shell that required connection-status transitions are exposed as status text and do not leave focus unusable.
    invalidation_behavior: Repair status announcement or focus continuity if a transition is not perceivable or leaves focus without a stable shell destination; do not weaken UAC-004 or UAC-006.
    scenario_refs: [UAC-004, UAC-006]
  - id: assumption-browser-connections-delivery
    validation: Validate in the assembled browser host that the visible Connections action opens the server-qualified diagnosis surface with the same observable outcome as Workspace.
    invalidation_behavior: Repair browser delivery if Connections cannot reach that diagnosis surface; do not weaken UAC-008 or make diagnosis Workspace-only.
    scenario_refs: [UAC-008]
