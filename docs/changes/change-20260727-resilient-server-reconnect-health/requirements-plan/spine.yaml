decision_points:
  - id: DP-RECOVERY-POLICY
    decision_key: recovery-policy
    layer: product
    subject: outcome
    consultation_policy: may_default
    contract_effect: normative
    answer_status: defaulted
    validation_status: not_applicable
    selected_option_ref: OPT-SIXTEEN-AUTO-THEN-MANUAL
    option_refs: [OPT-SIXTEEN-AUTO-THEN-MANUAL, OPT-ONE-AUTO-THEN-MANUAL, OPT-UNBOUNDED-AUTO]
    user_impact: [A failed shared-UI lifecycle has a predictable stopping boundary and a reusable manual recovery action.]
    recommendation: {option_ref: OPT-SIXTEEN-AUTO-THEN-MANUAL, basis: repository_constraint, evidence_refs: [clients/ui/src/socket/backoff.ts, docs/changes/change-20260727-resilient-server-reconnect-health/requirements.md], confidence: high, reversibility: moderate}
    provenance: {source: existing_product_behavior, confidence: confirmed, evidence_refs: [clients/ui/src/socket/backoff.ts, clients/ui/src/socket/connection.ts], rationale: The accepted finite-retry requirement is made exact using the existing MAX_ATTEMPTS value rather than inventing a new threshold.}
  - id: DP-RECOVERY-PROOF
    decision_key: recovery-proof
    layer: product
    subject: outcome
    consultation_policy: may_ask
    contract_effect: normative
    answer_status: answered
    validation_status: not_applicable
    selected_option_ref: OPT-DAEMON-HELLO
    option_refs: [OPT-DAEMON-HELLO, OPT-SOCKET-OPEN]
    user_impact: [The UI does not falsely report daemon recovery when only the gateway is reachable.]
    recommendation: {option_ref: OPT-DAEMON-HELLO, basis: repository_constraint, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/change.md], confidence: high, reversibility: moderate}
    provenance: {source: explicit_user_requirement, confidence: confirmed, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/change.md, clients/ui/src/socket/connection.ts], rationale: The accepted change package fixes daemon-derived hello as the recovery boundary.}
  - id: DP-STATUS-OWNER
    decision_key: status-owner
    layer: interaction
    subject: outcome
    consultation_policy: may_ask
    contract_effect: normative
    answer_status: answered
    validation_status: not_applicable
    selected_option_ref: OPT-STATUS-BAR-ONLY
    option_refs: [OPT-STATUS-BAR-ONLY, OPT-DUPLICATE-SHELL-SURFACES]
    user_impact: [Connection recovery state and action cannot disagree across multiple shell surfaces.]
    recommendation: {option_ref: OPT-STATUS-BAR-ONLY, basis: repository_constraint, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/requirements.md], confidence: high, reversibility: easy}
    provenance: {source: explicit_user_requirement, confidence: confirmed, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/requirements.md], rationale: FR-003 assigns compact connection presentation exclusively to the status bar.}
  - id: DP-FLEET-DENOMINATOR
    decision_key: fleet-denominator
    layer: product
    subject: outcome
    consultation_policy: may_ask
    contract_effect: normative
    answer_status: answered
    validation_status: not_applicable
    selected_option_ref: OPT-ENABLED-SERVERS
    option_refs: [OPT-ENABLED-SERVERS, OPT-ALL-CONFIGURED-SERVERS]
    user_impact: [Fleet health represents servers intended to participate.]
    recommendation: {option_ref: OPT-ENABLED-SERVERS, basis: repository_constraint, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/requirements.md], confidence: high, reversibility: easy}
    provenance: {source: explicit_user_requirement, confidence: confirmed, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/requirements.md], rationale: FR-006 excludes disabled servers from aggregate health.}
  - id: DP-HEALTH-BOUNDARY
    decision_key: health-boundary
    layer: product
    subject: outcome
    consultation_policy: may_ask
    contract_effect: normative
    answer_status: answered
    validation_status: not_applicable
    selected_option_ref: OPT-RUNTIME-ONLY
    option_refs: [OPT-RUNTIME-ONLY, OPT-PERSIST-HEALTH]
    user_impact: [A stale probe result cannot become saved configuration truth.]
    recommendation: {option_ref: OPT-RUNTIME-ONLY, basis: repository_constraint, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/change.md], confidence: high, reversibility: moderate}
    provenance: {source: explicit_user_requirement, confidence: confirmed, evidence_refs: [docs/changes/change-20260727-resilient-server-reconnect-health/change.md, ARCHITECTURE.md], rationale: Runtime health persistence is an explicit non-goal and would fabricate truth.}
  - id: DP-DIAGNOSIS-ENTRY
    decision_key: diagnosis-entry
    layer: interaction
    subject: outcome
    consultation_policy: may_default
    contract_effect: normative
    answer_status: defaulted
    validation_status: not_applicable
    selected_option_ref: OPT-STATUS-BAR-CONNECTIONS-BOTH-HOSTS
    option_refs: [OPT-STATUS-BAR-CONNECTIONS-BOTH-HOSTS, OPT-WORKSPACE-SETTINGS-ONLY]
    user_impact: [Browser and Workspace users can identify the affected configured server and available reason from fleet degradation.]
    recommendation: {option_ref: OPT-STATUS-BAR-CONNECTIONS-BOTH-HOSTS, basis: repository_constraint, evidence_refs: [ARCHITECTURE.md, docs/changes/change-20260727-resilient-server-reconnect-health/change.md], confidence: high, reversibility: moderate}
    provenance: {source: repository_evidence, confidence: confirmed, evidence_refs: [ARCHITECTURE.md, docs/changes/change-20260727-resilient-server-reconnect-health/change.md], rationale: "The architecture forbids host-specific fleet semantics, and the accepted outcome requires server-specific diagnosis."}
