contracts:
- id: contract-attach-transport-topology
  dimension: transport-topology
  owner: comp-attach
  requirement_refs: [fr-007, fr-009, fr-014, nfr-006]
  unit_refs: [unit-attach-runtime, unit-wire-codec, unit-transport-admission, unit-phase0-contract-pin]
  adr_refs: [adr-cli-attach-via-lifecycle-multiplexed-ws, adr-transport-close-reason-taxonomy]
  partition:
    outcomes: [determinate, unknown, inconclusive, conflicting]
    default_policy: A subscription outcome of accepted or waiting is non-terminal and must never be reported as established; absence of a terminal outcome before the apply deadline is unknown and fails attach without touching the terminal; a subscribe-time capacity refusal is inconclusive, arrives on an open socket as an error frame carrying the code resource_exhausted, exits with the transport code, and presents that code as its reason rather than a client-authored capacity sentence; a connection-level refusal or departure is inconclusive and takes its reason from contract-transport-close-taxonomy, so a capacity refusal, a going-away shutdown and an unexplained loss are never presented alike.
  verification:
  - id: ver-attach-topology-snapshot-two-clients
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestConcurrentAttachEachReceivesSnapshot
  - id: ver-attach-capacity-refusal-is-transport-with-the-published-reason
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestCapacityRefusalExitsTransportWithThePublishedReason
  - id: ver-attach-topology-no-per-session-route
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/gateway/ -run TestAttachNeverUsesPerSessionRoute
  - id: ver-attach-never-reports-accepted-as-established
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestNonTerminalOutcomesAreNotEstablished
- id: contract-attach-lease-progress
  dimension: progress-bound
  owner: comp-attach
  requirement_refs: [fr-013, fr-001]
  unit_refs: [unit-attach-runtime]
  verification:
  - id: ver-lease-renews-under-stdout-backpressure
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestLeaseRenewsWhileStdoutBlocked
  - id: ver-lease-revision-monotonic
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestLeaseRevisionIsMonotonic
  discretion:
  - id: discretion-pump-goroutine-topology
    unit_ref: unit-attach-runtime
    question: How are the input pump, output pump, and lease renewal arranged across goroutines and channels?
    scope:
      files: [clients/cli/internal/attach/pump.go, clients/cli/internal/attach/runtime.go]
      component: comp-attach
      visibility: private
    constraints:
    - Lease renewal must not be sequenced behind a stdout write.
    - Exactly one code path may restore the terminal.
    escalate_when:
    - Only a topology in which renewal depends on output progress can be made to work.
    - More than one code path ends up able to restore the terminal.
    - Cancellation requires a change to the gateway frame vocabulary.
    preserves:
      contract_refs: [contract-attach-lease-progress, contract-terminal-mode-lifecycle]
      invariant_refs: [fr-002, fr-013]
    verification_refs: [ver-lease-renews-under-stdout-backpressure]
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: files
      reversibility: bounded
      verification_strength: discriminating
      runtime_risk: concurrency
      coupling: coupled_within_unit
      grounding: evidenced
- id: contract-terminal-mode-lifecycle
  dimension: resource-lifecycle
  owner: comp-tty
  requirement_refs: [fr-002, fr-004, fr-001]
  unit_refs: [unit-tty-adapter, unit-attach-runtime, unit-platform-hardening-spikes]
  adr_refs: [adr-cli-raw-mode-critical-section]
  verification:
  - id: ver-restore-on-every-exit-path
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestTerminalRestoredOnEveryExitPath
  - id: ver-pre-subscribe-failure-leaves-terminal-untouched
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestPreSubscribeFailureNeverTouchesTerminal
  - id: ver-restore-is-idempotent
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/tty/ -run TestRestoreIsIdempotent
  - id: ver-non-tty-stdin-fails-without-mode-change
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestNonTTYStdinFailsWithoutModeChange
- id: contract-detach-boundary
  dimension: failure-semantics
  owner: comp-attach
  requirement_refs: [fr-010, fr-011, fr-001]
  unit_refs: [unit-attach-runtime, unit-tty-adapter, unit-platform-hardening-spikes]
  adr_refs: [adr-cli-raw-mode-critical-section]
  verification:
  - id: ver-post-detach-bytes-surface-nowhere
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestBytesAfterDetachKeySurfaceNowhere
  - id: ver-input-queue-flushed-before-restore
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestInputQueueFlushedBeforeRestore
  - id: ver-configured-detach-byte-only
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestOnlyConfiguredDetachByteTriggersDetach
  - id: ver-detach-sends-no-terminate
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestNoTerminateRequestOnAnyAttachShutdownPath
- id: contract-input-passthrough
  dimension: data-fidelity
  owner: comp-attach
  requirement_refs: [fr-005, fr-006]
  unit_refs: [unit-attach-runtime, unit-wire-codec]
  verification:
  - id: ver-utf8-sequence-never-split
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/gateway/ -run TestInputFramesNeverSplitUTF8
  - id: ver-input-fuzz-order-and-bytes
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/gateway/ -run FuzzInputFraming
  - id: ver-ctrl-c-forwarded-as-0x03
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestCtrlCForwardedNotTrapped
  discretion:
  - id: discretion-input-read-buffering
    unit_ref: unit-attach-runtime
    question: What stdin read buffer size and frame-coalescing granularity are used?
    scope:
      files: [clients/cli/internal/attach/input.go]
      component: comp-attach
      visibility: private
    constraints:
    - No frame may contain a partial UTF-8 sequence.
    - Read order must be preserved across coalescing.
    - The detach byte split position must be honoured before coalescing.
    escalate_when:
    - Preserving UTF-8 boundaries requires relaxing the boundary rule.
    - The server turns out to bound the byte count per input frame.
    - Coalescing changes observable input ordering.
    preserves:
      contract_refs: [contract-input-passthrough, contract-detach-boundary]
      invariant_refs: [fr-005, fr-006]
    verification_refs: [ver-utf8-sequence-never-split, ver-input-fuzz-order-and-bytes]
    difficulty_inputs:
      decision_reasoning: mechanical
      boundary_reach: private
      context_scope: files
      reversibility: trivial
      verification_strength: discriminating
      runtime_risk: normal
      coupling: coupled_within_unit
      grounding: evidenced
- id: contract-output-passthrough
  dimension: data-fidelity
  owner: comp-attach
  requirement_refs: [fr-007, fr-008, fr-009, nfr-004]
  unit_refs: [unit-attach-runtime, unit-wire-codec]
  verification:
  - id: ver-output-bytes-are-byte-faithful
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/gateway/ -run TestSurfaceOutputDecodesToExactBytes
  - id: ver-foreign-session-output-dropped
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestForeignSessionOutputNeverReachesStdout
  - id: ver-first-payload-written-first
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestSubscribeSnapshotWrittenBeforeLiveOutput
- id: contract-wire-shape-conformance
  dimension: integration-contract
  owner: comp-wire
  requirement_refs: [nfr-008, fr-018]
  unit_refs: [unit-wire-codec, unit-phase0-contract-pin]
  adr_refs: [adr-cli-sessioninfo-golden-vector-conformance]
  verification:
  - id: ver-server-serialization-matches-golden-vector
    tier: T2
    command: cd services && GOWORK=off go test ./host/state/view/ -run TestSessionInfoGoldenVectorIsStable
  - id: ver-cli-decodes-the-same-golden-vector
    tier: T0
