- title: unit-shared-goclient-config
  chunk: One Go loader for the canonical client configuration contract
  contract_refs: [contract-config-and-fleet-identity, contract-client-config-parity]
  files:
  - clients/goclient/go.mod
  - clients/goclient/clientconfig/
  - clients/web-host/internal/clientconfig/
  - clients/web-host/go.mod
  acceptance:
  - Exactly one Go package parses servers.json, both Go hosts import it, and a repository check fails when a second Go parser of that document appears.
  - The package is importable from another module without an internal path, and the canonical URL and server identifier derivations are byte-identical to the code they replace.
  - The configuration directory resolves to the same place the other client hosts use on each supported platform, including the Windows branch the current Go loader lacks, and no code path or test writes into a configuration directory.
  - The web host keeps loading its fleet through this package, and every behaviour it inherits that differs from today is one the expected-outcome corpus declares rather than an incidental effect of the move.
  objective: Give the Go language exactly one projection of the canonical client configuration contract, so neither Go host can drift from the contract or from the other.
  output_format: A Go module holding the single loader package, updated web-host imports, and tests driven by the shared expected-outcome corpus.
  tool_guidance: Move rather than copy; keep the canonical URL and server identifier derivation byte-identical, and add the missing platform branch as a declared behaviour change with its own corpus entry.
  task_boundaries: Do not change the servers.json contract in this unit, do not add the naming constraint here, and do not treat the web host as the origin of the contract — it is one consumer of it, exactly like the CLI, Workspace and Windows Shell.
  decision_closure_reason: One loader per language rather than a per-host reimplementation is closed by adr-shared-go-client-config-module.
- title: unit-client-config-parity
  chunk: Canonical client configuration contract and its three-language parity corpus
  contract_refs: [contract-client-config-parity, contract-config-and-fleet-identity]
  files:
  - clients/config/README.md
  - clients/config/servers.schema.json
  - clients/config/fixtures/
  - clients/goclient/clientconfig/
  - clients/workspace/src/main/desktop-config.ts
  - clients/windows-shell/AgentGrid.Shell.Core/Configuration/DesktopConfig.cs
  depends_on: [unit-shared-goclient-config]
  acceptance:
  - Every fixture in the shared corpus carries its own expected outcome — the accept-or-reject decision, the admission state of each entry, the canonical URL and the derived server identifier — and the Go, TypeScript and C# loaders each assert against that record rather than against a bare throws-or-does-not-throw.
  - "The corpus covers every rule the contract declares, including the four the README already promises while no fixture exercises them today — a duplicate URL, more than one default-execution entry, zero enabled entries, and an unparseable document."
  - The three measured divergences are closed in the direction the contract declares and pinned by the corpus — unknown entry fields, credentials or query or fragment inside a URL, and the missing Windows configuration-directory branch.
  - The README states that the contract is canonical for every client host and names its consumers, and the schema is either read by the loaders or explicitly declared documentation-only, so the document and the behaviour cannot disagree silently.
  objective: Make clients/config the canonical client configuration contract for every host and make three-language agreement a mechanical property rather than a claim in a README.
  output_format: An expected-outcome fixture corpus under the shared fixtures directory, a corpus reader in each of the three languages, and README and schema updates.
  tool_guidance: Extend the existing shared-fixture tests in all three languages rather than adding a fourth mechanism, and record each expected outcome as data so that adding a rule means adding a fixture rather than editing three test bodies.
  task_boundaries: Do not add the naming constraint or the per-entry admission states here — this unit only makes the contract as it stands mechanically comparable. Do not touch any host's own runtime settings, which are outside the client configuration contract.
  decision_closure_reason: The scope of common ownership — the contract itself rather than one host's loader, and parity across all three languages — is closed by adr-shared-go-client-config-module.
- title: unit-server-naming-contract
  chunk: Server naming rule and per-entry configuration admission
  contract_refs: [contract-server-naming-prerequisite, contract-config-entry-admission, contract-client-config-parity]
  files:
  - clients/config/servers.schema.json
  - clients/config/README.md
  - clients/config/fixtures/
  - clients/goclient/clientconfig/
  - clients/web-host/internal/webhost/host.go
  - clients/workspace/src/main/desktop-config.ts
  - clients/windows-shell/AgentGrid.Shell.Core/Configuration/DesktopConfig.cs
  depends_on: [unit-client-config-parity]
  acceptance:
  - Display names are unique among enabled entries by exact code-point equality after trimming and are restricted to the declared CLI-safe character set, and each violation is enforced identically by the Go, TypeScript and C# loaders against the shared corpus.
  - A configuration containing a violating entry lets the host start; that entry and every entry it collides with are admitted as configuration-invalid, are never connected to, and are never renamed, normalised, deduplicated, or dropped.
  - Every error class a single entry or a collision group can be blamed for is per-entry, including the duplicate-URL check that is file-level today; only an unreadable entry list stops the host, and it is reported without naming an entry because none can be named.
  - Each configuration-invalid entry carries its position in the entry list, its display name as written, and the rule it violates, and the web host no longer refuses to serve a fleet in which no entry is usable.
  objective: Make an operator-configured display name a usable server qualifier while replacing whole-configuration rejection with per-entry admission, so one bad entry costs one server rather than the whole client.
  output_format: Schema and README updates, three loader changes, new corpus fixtures for every per-entry and file-level class, and a migration note.
  tool_guidance: Extend the existing duplicate-URL check into the per-entry admission path rather than adding a second validation pass, and keep the failure message shape consistent with the existing configuration errors.
  task_boundaries: Do not remove the existing collision disambiguation in the graphical clients in this unit, and do not extend the credential-free host projection to carry the new state — the CLI reads the loader directly, and widening the projection for the SPA is a separate change.
  decision_closure_reason: The constraint itself is a confirmed upstream constraint; its enforcement point, character set, migration shape, and the per-entry-versus-file-level partition are closed by adr-server-display-name-naming-contract.
- title: unit-transport-close-taxonomy-prerequisite
  chunk: Public transport close reason vocabulary
  contract_refs: [contract-transport-close-taxonomy]
  files:
  - protocol/transport-close.schema.json
  - protocol/README.md
  - services/server/api/gateway.go
  - services/server/api/mux.go
  - services/server/api/auth.go
  - services/server/api/protocol_version.go
  - services/gorules/static_enforcement_test.go
  acceptance:
  - A closed reason vocabulary is published under protocol/ together with the control-frame shape that carries it — a shape no schema models today — and a repository gate fails when a server close site uses a reason outside it.
  - Every server-initiated close of a client socket carries exactly one published reason, including the departures that send nothing at all today because they unwind into an abrupt close.
  - A ticket or credential rejection and a protocol-version rejection carry the same vocabulary in their JSON error body, so a pre-upgrade rejection stops being indistinguishable from a network drop.
  - A capacity refusal, a going-away shutdown, a backend loss and an unexplained drop are four distinguishable observations from the public contract alone, with no client-side guessing and without depending on a numeric close code.
  objective: Give every client one typed answer to why a connection ended, replacing five ad-hoc reason strings that no schema models and no shipped client reads.
  output_format: A protocol schema plus gateway, ticket and version-gate changes, with tests over each departure shape and a registration entry in the enumerating gate.
  tool_guidance: Keep the two-step shape the accepted close ADR established — control frame first, then the close — and put the taxonomy in the reason slot rather than inventing numeric close codes, so one vocabulary covers both the close frame and the pre-upgrade error body.
  task_boundaries: Do not change the browser or Workspace clients to consume the new value in this unit; they gain the capability and adopt it in their own change. Do not alter the exit-code assignment, which is fixed elsewhere.
  decision_closure_reason: Whether transport failure carries a type at all, and where that type lives in the public contract, are closed by adr-transport-close-reason-taxonomy.
- title: unit-module-skeleton
  chunk: CLI module skeleton, verb dispatch, and gate registration
  contract_refs: [contract-module-boundary, contract-exit-classification, contract-protocol-admission]
  files:
  - clients/cli/go.mod
  - clients/cli/cmd/agent-grid/main.go
  - clients/cli/internal/app/root.go
  - clients/cli/internal/app/flags.go
  - clients/cli/.golangci.yml
  - Makefile
  - test-harness/profiles.json
  depends_on: [unit-phase0-contract-pin]
  acceptance:
  - The module builds with no dependency edge to the services module and a check fails if one appears.
  - Build, test, vet, lint, and the pull-request verification profile all cover the new module.
  - The first argument is always treated as a verb, and a session identifier passed positionally exits 2.
  - Every failure class maps to its fixed exit code in exactly one place, and the mapping is asserted value by value.
  - The compiled protocol version appears exactly once in a projection file that the repository manifest check enumerates.
  objective: Establish the module boundary as a mechanical property and give every later unit one place where failure classes become exit codes.
  output_format: A buildable Go module with entry point, plus edits to the repository build and verification entry points.
  tool_guidance: Mirror the existing independent web host module and the existing dependency-check Makefile target rather than inventing a new pattern.
  task_boundaries: Do not implement any command behaviour beyond dispatch and exit-code mapping.
- title: unit-transport-admission
  chunk: Auth bootstrap and protocol admission
  contract_refs: [contract-protocol-admission, contract-attach-transport-topology, contract-exit-classification, contract-transport-close-taxonomy]
  files:
  - clients/cli/internal/gateway/client.go
  - clients/cli/internal/gateway/auth.go
  depends_on: [unit-shared-goclient-config, unit-module-skeleton]
  acceptance:
  - Every operational request carries the bearer credential and the compiled protocol version.
  - A version-mismatch response prevents any further operational request or socket frame for that server.
  - The socket is opened only through a freshly minted single-use ticket, and the bearer credential never appears in a URL.
  - No failure path puts the credential, the minted ticket, or a URL carrying either into an error string, a log line, or a process argument.
  objective: Make admission a fail-closed gate that later units cannot bypass and that cannot leak the credential on the path most likely to echo it.
  output_format: A transport package exposing request and socket-dial seams that a fake can substitute.
  tool_guidance: Follow the existing two-step mint-then-connect flow used by the other clients, and redact at the point where the transport error is turned into a reason rather than at each call site.
  task_boundaries: Do not add any alternative authentication path for the socket upgrade.
- title: unit-fleet-reachability
  chunk: Fleet reachability observation
  contract_refs: [contract-protocol-admission, contract-discovery-projection, contract-config-entry-admission]
  files:
  - clients/cli/internal/fleet/fleet.go
  depends_on: [unit-transport-admission]
  acceptance:
  - Each usable configured entry resolves to one observation drawn from the existing closed vocabulary, with a reason drawn from the existing closed reason set.
  - One failing server never suppresses the results of another.
  - Reachability values never share a value space with session lifecycle state, and configuration invalidity is a third value that shares a space with neither.
  - A configuration-invalid entry is carried through with the rule it violates and is never probed, so it can never acquire a reachability observation and can never be presented as unreachable.
  objective: Give discovery and selector resolution a per-entry admission and reachability fact they can both branch on.
  output_format: A package returning a per-entry admission and observation set plus the sessions of the healthy servers.
  tool_guidance: Reuse the existing observation and reason vocabularies verbatim; add configuration invalidity as a new kind inside the same closed set rather than as a free-form string, following the precedent that disabled is already a non-reachability admission kind there.
  task_boundaries: Do not add retry policy, background refresh, or health caching, and do not repair or normalise a configuration-invalid entry.
- title: unit-wire-codec
  chunk: Wire codec, identity ownership, and shape conformance
  contract_refs: [contract-input-passthrough, contract-output-passthrough, contract-attach-transport-topology, contract-wire-shape-conformance, contract-identity-single-origin]
  files:
  - clients/cli/internal/gateway/wire.go
  - clients/cli/internal/gateway/identity.go
  - clients/cli/internal/gateway/wire_test.go
  - services/host/state/view/view_golden_test.go
  depends_on: [unit-transport-admission]
  acceptance:
  - Output payloads decode to exactly the original bytes, including sequences that are not valid text.
  - Input frames never contain a partial multi-byte sequence, under fuzzing over arbitrary split points.
  - Outbound frames carry the bare upstream session identifier, never a compound one, and exactly one package constructs a server-qualified identity while exactly one package serialises an outbound frame.
  - The checked-in golden vector decodes in the CLI and is reproduced by the server's own serializer, so renaming a field the CLI reads fails a gate on the server side.
  objective: Own every byte that crosses the socket in one place, and make a server-side rename of a field the CLI reads a failing test rather than a silent break.
  output_format: A hand-written standard-library-only codec package with table and fuzz tests, plus a golden-vector test on the server serializer.
  tool_guidance: Mirror the field names captured in the Phase 0 fixtures exactly; do not invent a convenience framing and do not add a generated SDK language.
  task_boundaries: Do not add a code generator and do not depend on the services module for types.
