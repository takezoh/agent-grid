artifact: design-plan-spine
version: 2
granularity_profile: algorithm-bound

requirements:
- id: fr-001
  type: invariant
  priority: must
  statement: The CLI shall not emit a session-termination request on any code path other than the explicit terminate command, including detach, Ctrl-C, terminal close, stdin EOF, catchable signals, uncatchable process kill, WebSocket close, and post-raw-mode auth or protocol failure.
- id: fr-002
  type: invariant
  priority: must
  statement: While the CLI holds raw mode, the CLI shall restore the invoking terminal's echo and line editing before the process exits, suspends, or returns control to the shell, on every exit path.
- id: fr-003
  type: invariant
  priority: must
  statement: The CLI shall not create, modify, or delete any file under the client configuration directory or under the daemon data directory.
- id: fr-004
  type: event
  priority: must
  statement: When attach is invoked and stdin is not a terminal, the CLI shall not apply any terminal mode change to the controlling terminal, shall not open a surface subscription, and shall exit with the non-TTY failure class and a non-zero code.
- id: fr-005
  type: state
  priority: must
  statement: While attached, the CLI shall deliver every stdin byte to the remote PTY in read order without local echo, forwarding Ctrl-C as 0x03 rather than taking it as a local interrupt.
- id: fr-006
  type: state
  priority: must
  statement: The CLI shall not place a partial UTF-8 sequence in a surface input frame, and shall hold an incomplete trailing sequence until the remaining bytes are read or the input stream ends.
- id: fr-007
  type: event
  priority: must
  statement: When a surface subscription is established, the CLI shall write the first output payload it receives to stdout before any subsequent payload, so the session's current screen appears without local reconstruction.
- id: fr-008
  type: state
  priority: must
  statement: The CLI shall base64-decode surface output payloads to raw bytes and write those bytes to stdout unmodified, and shall not parse, render, or re-encode terminal escape sequences.
- id: fr-009
  type: invariant
  priority: must
  statement: The CLI shall drop every surface output frame whose carried session id differs from the attached session id.
- id: fr-010
  type: event
  priority: must
  statement: When the detach key byte is consumed, the CLI shall discard every subsequent input byte, shall discard the terminal input queue before restoring cooked mode, and shall not forward any of those bytes to the remote PTY.
- id: fr-011
  type: state
  priority: must
  statement: The CLI shall treat exactly the configured detach byte as the detach trigger and shall forward every other byte, including the default 0x1D when it is not configured as the trigger, to the remote PTY.
- id: fr-012
  type: state
  priority: must
  statement: The CLI shall declare its terminal geometry when the subscription is established and shall forward every subsequent local size change, clamping columns and rows into the accepted range before sending.
- id: fr-013
  type: state
  priority: must
  statement: While attached, the CLI shall renew its terminal lifecycle lease on a schedule that cannot be delayed by stdout write backpressure or by surface output volume.
- id: fr-014
  type: event
  priority: must
  statement: When the CLI leaves the attached state, it shall restore the terminal first and then present a reason that distinguishes explicit detach, transport loss, and server-side session end from one another.
- id: fr-015
  type: ubiquitous
  priority: must
  statement: The CLI shall list sessions from every enabled configured server, shall not filter by creator, and shall not itself remove or hide any session the server publishes, including sessions whose lifecycle state indicates they have ended.
- id: fr-016
  type: event
  priority: must
  statement: When one or more configured servers are unreachable or protocol-incompatible, the CLI shall still present the sessions of the healthy servers and shall present the connection-side condition in a vocabulary disjoint from session lifecycle state.
- id: fr-017
  type: invariant
  priority: must
  statement: The CLI shall derive every session state label and the precedence used to collapse simultaneous conditions from the checked-in shared status display matrix, and shall not introduce a CLI-specific state word.
- id: fr-018
  type: state
  priority: must
  statement: The CLI shall render the session display name as the server-provided card title verbatim, with no client-side fallback, derivation, or truncation.
- id: fr-019
  type: invariant
  priority: must
  statement: The CLI shall present the owning server on every session row, shall emit server identity and session identity as separate machine-readable fields, and shall not emit any single concatenated identifier as the only way to name a session.
- id: fr-020
  type: state
  priority: must
  statement: The CLI shall resolve a session selector only under an explicitly declared selector kind, shall never fall back to another kind, and shall present mutually distinguishable candidates with a non-zero exit and no side effect when more than one session matches.
- id: fr-021
  type: state
  priority: must
  statement: The CLI shall accept a server qualifier supplied independently of the selector string, accepting both the user-configured display name and the derived stable server identifier as its value.
- id: fr-022
  type: event
  priority: must
  statement: When session creation is invoked without an explicit target server, the CLI shall create no session and shall exit with the usage-error class, regardless of how many servers are configured or reachable.
- id: fr-023
  type: event
  priority: must
  statement: When explicit terminate is invoked, the CLI shall report success only after the server has acknowledged that the termination was applied, shall exit non-zero when the request was rejected, and shall leave the target's observable state unchanged in that case.
- id: fr-024
  type: ubiquitous
  priority: must
  statement: The CLI shall exit 0 on success, 1 on an internal fault, 2 on a usage error, 3 on not-found, 4 on an ambiguous selector, 5 on an authentication-or-compatibility failure, and 6 on a transport failure; shall reproduce the same output and exit code for the same input; and shall classify both a selector that matches only on an unreachable server and a capacity refusal of attach establishment as transport failure, separating the latter by its stated reason.
- id: fr-025
  type: ubiquitous
  priority: must
  statement: The CLI shall produce identical output content and exit codes for the same input whether or not stdout is a terminal, and shall not add a confirmation prompt or a candidate-selection prompt in any environment.
- id: fr-026
  type: invariant
  priority: must
  statement: The execution plane shall keep a session observable with a terminal lifecycle state after it ends by explicit termination, by clean or signalled self-exit, or by its backend frame vanishing, and shall publish that transition on the lifecycle socket; the CLI shall never reconstruct that observation from local memory.
- id: fr-027
  type: invariant
  priority: must
  statement: The CLI shall not place the bearer credential, a minted WebSocket ticket, or any URL carrying either into a failure reason, a diagnostic line, a log, or a process argument.
- id: fr-028
  type: event
  priority: must
  statement: When a client host loads a configuration entry whose display name duplicates another entry's or falls outside the declared CLI-safe character set, it shall start, shall place that entry and every entry it collides with in the configuration-invalid admission state, shall not connect to any of them, and shall not rename, normalise, deduplicate, or silently drop any of them.
- id: fr-029
  type: event
  priority: must
  statement: When a server-qualifier value matches configured entries of which every match is unusable, the CLI shall exit with the usage-error class naming each matching entry and the rule it violates; when more than one usable entry matches, the CLI shall present those entries as mutually distinguishable candidates and exit with the ambiguous-selector class without selecting one; and it shall report neither case as not-found nor as a transport failure.
- id: fr-030
  type: event
  priority: must
  statement: When a client host loads a client configuration whose entry list is readable, it shall start and admit every entry independently, placing each entry that violates a per-entry rule — and every member of a colliding group — in the configuration-invalid admission state rather than refusing the whole configuration; it shall stop at load only when the entry list itself cannot be read.
- id: fr-031
  type: state
  priority: must
  statement: The CLI shall present every configured server entry including entries in the configuration-invalid admission state, shall express configuration invalidity in a vocabulary disjoint from both server reachability and session lifecycle state, and shall name each such entry by its position in the entry list and by its display name as written together with the rule it violates.
- id: fr-032
  type: invariant
  priority: must
  statement: Every server-initiated close of a client socket shall carry a reason drawn from a closed published vocabulary, and the CLI shall derive both its transport failure classification and its presented reason from that value rather than from the close code alone or from a client-authored string.
- id: nfr-001
  type: compatibility
  priority: must
  statement: The CLI shall carry exactly one compiled protocol version, shall treat any difference, absence, or malformation as incompatible protocol, and shall not enter any operational REST handler or WebSocket application frame for that server.
- id: nfr-002
  type: invariant
  priority: must
  statement: The CLI module shall not require, replace, or import the repository's services module, and this shall be enforced by the module graph rather than by review.
- id: nfr-003
  type: portability
  priority: must
  statement: The CLI shall resolve its configuration directory to the same location the existing client hosts use on the same platform, and shall accept the same explicit directory override.
- id: nfr-004
  type: invariant
  priority: must
  statement: The CLI shall not persist, reconstruct, or replay terminal screen state; the subscribe-time snapshot delivered by the execution plane shall be the only recovery mechanism.
- id: nfr-005
  type: maintainability
  priority: must
  statement: The CLI module shall be registered in the repository's build, test, vet, lint, verification-profile, and protocol-version-projection entry points at introduction time.
- id: nfr-006
  type: invariant
  priority: must
  statement: The CLI shall not present any indication of other clients attached to the same session.
- id: nfr-007
  type: invariant
  priority: must
  statement: Server-qualified session identity construction and outbound frame serialization shall each have exactly one owning package inside the CLI module, enforced by a test that fails when another package performs either.
- id: nfr-008
  type: compatibility
  priority: must
  statement: The session payload fields the CLI reads shall be pinned by a checked-in golden vector that the server's own serialization is tested against, so that renaming or moving one of those fields fails a repository gate.
- id: nfr-009
  type: compatibility
  priority: must
  statement: The client configuration contract shall have exactly one loader implementation per client language, and the accept-or-reject decision, the per-entry admission state, the canonical URL and the derived server identifier produced by the Go, TypeScript and C# loaders shall be pinned to one shared fixture corpus in which every fixture carries its own expected outcome.

