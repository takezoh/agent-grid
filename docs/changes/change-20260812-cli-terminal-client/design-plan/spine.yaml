- title: unit-discovery-render
  chunk: Discovery rendering and machine-readable output
  contract_refs: [contract-discovery-projection, contract-config-entry-admission]
  files:
  - clients/cli/internal/view/table.go
  - clients/cli/internal/view/json.go
  depends_on: [unit-fleet-reachability, unit-status-vocabulary]
  acceptance:
  - Every row names its owning server, and rows survive when another server is unreachable.
  - Machine-readable output carries server identity and session identity as separate fields with the same breadth as the default columns.
  - An unreachable server, a configuration-invalid entry and a healthy server with no sessions are three distinguishable observations from the machine-readable output alone, and configuration invalidity shares a value space with neither reachability nor session lifecycle state.
  - A configuration-invalid entry appears with its position in the entry list, its display name as written, and the rule it violates, and is never omitted from the output.
  - The display name is the server-provided card title verbatim and is never truncated, and no session the server publishes is removed by the client.
  objective: Deliver the first end-to-end useful command against a live fleet.
  output_format: A rendering package plus the list command wiring.
  tool_guidance: Take the display name from the card title, not from the driver name field and not from a path basename; take the working-directory column from the field the Phase 0 observation identified.
  task_boundaries: Do not add sorting, filtering, or paging options beyond what the contract names. Do not settle the model column in either direction here — the upstream availability premise is measured false, the column set is a requirements-side decision returned as open-model-column-premise-falsified, and this unit renders whatever DP-LS-DEFAULT-COLUMNS resolves to rather than a set design fixed on its own authority.
- title: unit-selector
  chunk: Selector resolution
  contract_refs: [contract-selector-resolution, contract-exit-classification, contract-server-naming-prerequisite]
  files:
  - clients/cli/internal/selector/selector.go
  depends_on: [unit-discovery-render]
  acceptance:
  - A declared selector kind decides the resolution even when another kind would match a single session.
  - A server qualifier given as a display name and as a stable identifier both narrow to the same single session.
  - A server-qualifier value matching two usable entries exits with the ambiguous-selector code and selects neither; a value whose every match is configuration-invalid exits with the usage-error code naming each entry and its violated rule; and a stable identifier resolves to at most one usable entry.
  - Zero matches with an unreachable server present is reported as a transport failure, not as not-found, and every failure path leaves every session untouched.
  objective: Make target selection predictable enough that automation can branch on the outcome, including when a configured entry is unusable.
  output_format: A resolution package returning a typed outcome rather than an identifier plus error.
  tool_guidance: Restrict selector kinds to the full identifier and the identifier prefix; there is no stable name field to key on.
  task_boundaries: Do not add interactive selection and do not auto-select from candidates.
- title: unit-tty-adapter
  chunk: Platform terminal adapter
  contract_refs: [contract-terminal-mode-lifecycle, contract-geometry-propagation, contract-detach-boundary]
  files:
  - clients/cli/internal/tty/tty.go
  - clients/cli/internal/tty/tty_unix.go
  - clients/cli/internal/tty/tty_windows.go
  - clients/cli/internal/tty/tty_fake.go
  depends_on: [unit-module-skeleton]
  acceptance:
  - Raw entry, restore, size query, size-change events, input-queue discard, and terminal detection are all reachable only through one interface.
  - Restore is idempotent and safe to call from a deferred path and from a signal path.
  - A fake implementation can drive every one of those operations deterministically without a real terminal.
  objective: Confine every terminal side effect behind one seam so the attach runtime is testable without a real terminal.
  output_format: An interface with a Unix implementation, a Windows implementation stub pending the platform spike, and a fake.
  tool_guidance: Use the terminal library already accepted in the repository rather than raw system calls where it suffices.
  task_boundaries: Do not implement Windows-specific behaviour ahead of the platform spike results; leave it explicitly unimplemented rather than guessed.
- title: unit-attach-runtime
  chunk: Attach runtime
  contract_refs: [contract-attach-transport-topology, contract-attach-lease-progress, contract-terminal-mode-lifecycle, contract-detach-boundary, contract-input-passthrough, contract-output-passthrough, contract-geometry-propagation, contract-exit-classification, contract-transport-close-taxonomy]
  files:
  - clients/cli/internal/attach/runtime.go
  - clients/cli/internal/attach/input.go
  - clients/cli/internal/attach/output.go
  - clients/cli/internal/attach/pump.go
  depends_on: [unit-selector, unit-tty-adapter, unit-wire-codec, unit-fake-gateway]
  acceptance:
  - The current screen appears before any later output, and output from another subscribed session never reaches standard output.
  - Raw mode is entered only after the subscription reaches a terminal accepted outcome, and the terminal is restored on every exit path including suspend and signal.
  - Bytes typed after the detach key reach neither the remote session nor the returning shell.
  - The lease keeps being renewed while standard output is blocked, a capacity refusal exits with the transport code carrying the reason the server published rather than a client-authored sentence, and the session survives every departure.
  - Every published close reason maps to the exit class the classification contract assigns it, and a departure that carries no reason at all is presented as an unattributed loss rather than being guessed into one of the named reasons.
  objective: Deliver the interactive attach experience with its runtime discipline pinned by discriminating tests.
  output_format: An attach package driven end to end by the fake gateway and the fake terminal.
  tool_guidance: Split the buffer at the detach byte rather than filtering it, and discard the terminal input queue before restoring.
  task_boundaries: Do not add automatic reconnection, do not add a status line during raw mode, and do not add any ownership or takeover concept.
- title: unit-lifecycle-commands
  chunk: Lifecycle commands
  contract_refs: [contract-create-and-attach, contract-explicit-terminate, contract-identity-single-origin]
  files:
  - clients/cli/internal/lifecycle/create.go
  - clients/cli/internal/lifecycle/terminate.go
  depends_on: [unit-attach-runtime]
  acceptance:
  - The launch profile set is read from the target server at invocation time with its server-validated revision, is not cached across invocations, and an unresolvable agent argument or a stale revision fails before any request that could create a session.
  - Creation failure, creation success with attach failure, and full success are three distinct observations, and the middle one reports the created identifier.
  - A creation with --no-attach attempts no attach at all, exits zero, and reports an identifier that resolves to a running row on the named server, so it is neither reported as an attach failure nor confused with one.
  - Creation without an explicit target server creates nothing and exits 2, even when exactly one server is configured.
  - Termination reports success only on an acknowledgement that it was applied, asserts no lifecycle state it has not read back, and a rejected request leaves the target's observable state unchanged.
  objective: Complete the command surface while keeping termination a single, deliberate, auditable emission that claims only what it observed.
  output_format: A lifecycle package plus the create and terminate command wiring.
  tool_guidance: Ignore the default-execution marker in the configuration; it exists and would silently satisfy a target inference.
  task_boundaries: Do not expose a forced-termination variant, and do not keep a local record of terminated sessions to compensate for the retention gap.
- title: unit-fake-gateway
  chunk: Fake gateway and dependency registration
  contract_refs: [contract-external-dependency-registration]
  files:
  - clients/cli/internal/gateway/fakegateway/fakegateway.go
  - test-harness/dependencies.json
  depends_on: [unit-wire-codec]
  acceptance:
  - The fake drives ticket minting, admission, the initial frame, subscription, output, capacity refusal, and each disconnect shape deterministically.
  - The gateway boundary and the local terminal boundary are both declared in the dependency registry with a fake, a named invariant contract test, and a fidelity backstop.
  - The registry check passes in the pull-request verification profile.
  objective: Give every later test a deterministic counterparty and put both external boundaries under the repository's admission discipline.
  output_format: A fake package plus registry entries.
  tool_guidance: Shape the fake from the Phase 0 captured fixtures so it cannot drift into a convenient dialect.
  task_boundaries: Do not weaken any assertion to make the fidelity backstop pass; correct the fake instead.
- title: unit-terminal-state-retention-prerequisite
  chunk: Execution-plane terminal-state retention prerequisite
  contract_refs: [contract-session-terminal-state-retention]
  files:
  - services/host/state/reduce_session.go
  - services/host/state/reduce_frame_evict.go
  - services/host/state/reduce_tick.go
  - services/host/state/view/status.go
  - services/server/api/gateway.go
  acceptance:
  - A session ended by explicit termination remains observable with a terminal lifecycle state instead of disappearing from the session list.
  - A session ended by a clean or signalled self-exit, and a session whose backend frame vanished, both remain observable with the same terminal lifecycle state.
  - The transition to the terminal state is published on the lifecycle socket, so an attached client can attribute its departure to a session end rather than to a lost connection.
  - An ended session and an identifier that never existed are distinguishable through the public contract, and the retention window and its reclamation have one named owner.
  objective: Make the terminal lifecycle state the public protocol already declares actually reachable, so ended sessions are observable to every client instead of being deleted.
  output_format: Reducer and publication changes in the execution plane plus tests over the four termination paths.
  tool_guidance: Keep the frame and process teardown exactly as it is; change only what happens to the session record and to what is published.
  task_boundaries: Do not move any part of the retention responsibility into a client, and do not invent a retention window or a reclamation schedule — name the owner and leave the value to it.
  decision_closure_reason: The gap and the three source-requirement conditions are argued in adr-cli-session-terminal-state-retention-prerequisite, which the user consultation accepted; the retention window and reclamation policy are the one point the acceptance deliberately left open, carried as open-terminate-observability.
- title: unit-platform-hardening-spikes
  chunk: Platform hardening and spikes
  contract_refs: [contract-terminal-mode-lifecycle, contract-geometry-propagation, contract-detach-boundary]
  files:
  - clients/cli/internal/tty/tty_windows.go
