  - id: ver-outbound-serialization-has-one-owner
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/gateway/ -run TestOutboundFrameSerializationHasExactlyOneSite
  - id: ver-ownership-gate-fails-on-synthesized-violation
    tier: T2
