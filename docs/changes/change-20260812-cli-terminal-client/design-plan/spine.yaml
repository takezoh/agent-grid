- id: contract-exit-classification
  dimension: failure-semantics
  owner: comp-entry
  requirement_refs: [fr-014, fr-024, fr-025, fr-027, fr-029, fr-032]
  unit_refs: [unit-attach-runtime, unit-module-skeleton, unit-selector, unit-transport-admission, unit-phase0-contract-pin]
  adr_refs: [adr-cli-failure-class-exit-codes, adr-transport-close-reason-taxonomy]
  partition:
    outcomes: [determinate, inconclusive]
    default_policy: A departure is determinate when it carries a published transport close reason, a locally observed detach byte, or a published session-end transition, and the class follows the value rather than a client guess — unauthenticated and incompatible_protocol exit 5, capacity and going_away and backend_unavailable exit 6, invalid_request exits 1, and a qualifier naming only unusable configuration entries exits 2; a departure carrying no reason at all is inconclusive, is presented as an unattributed transport loss, and is never presented as not-found, as a clean detach, or as one of the named reasons.
  verification:
  - id: ver-departure-classes-follow-the-published-reason
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestDepartureReasonsFollowThePublishedCloseReason
  - id: ver-exit-codes-match-the-fixed-assignment
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/app/ -run TestFailureClassesMapToTheFixedExitCodes
  - id: ver-tty-and-non-tty-identical
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/app/ -run TestInteractiveAndPipedInvocationsAgree
  - id: ver-credential-never-reaches-diagnostics
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/app/ -run TestAuthFailureDiagnosticsCarryNoCredentialTicketOrURL
- id: contract-transport-close-taxonomy
  dimension: contract-evolution
  owner: comp-gateway-transport
  requirement_refs: [fr-032, fr-014, fr-024]
  unit_refs: [unit-transport-close-taxonomy-prerequisite, unit-transport-admission, unit-attach-runtime]
  adr_refs: [adr-transport-close-reason-taxonomy]
  partition:
    outcomes: [determinate, unknown, inconclusive]
    default_policy: A departure the server initiated is determinate and carries exactly one reason from the published closed vocabulary, delivered in the close frame's reason slot and, whenever the connection is still writable, in a control frame first; a rejection that happens before the socket is accepted is determinate and carries the same vocabulary in the JSON error body's code field, because a pre-upgrade rejection cannot carry a close reason; a departure that carries no reason is inconclusive, is the only case a client may classify locally, and is presented as an unattributed loss rather than being guessed into one of the named reasons; a reason outside the vocabulary is unknown, is rejected by the decoder, and is never presented as a known cause.
  verification:
  - id: ver-every-server-initiated-close-carries-a-published-reason
    tier: T1
    command: cd services && GOWORK=off go test ./server/api/ -run TestEveryServerInitiatedCloseCarriesAPublishedReason
  - id: ver-pre-upgrade-rejections-carry-the-same-vocabulary
    tier: T1
    command: cd services && GOWORK=off go test ./server/api/ -run TestTicketAndVersionRejectionsCarryTheSameReasonVocabulary
  - id: ver-close-reason-vocabulary-is-closed-and-registered
    tier: T2
    command: cd services && GOWORK=off go test ./gorules/ -run TestTransportCloseReasonVocabularyIsRegisteredAndExhaustive
  - id: ver-cli-maps-each-close-reason-to-its-exit-class
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestEachPublishedCloseReasonMapsToItsExitClass
- id: contract-protocol-admission
  dimension: compatibility
  owner: comp-transport
  requirement_refs: [nfr-001, fr-016, nfr-005]
  unit_refs: [unit-transport-admission, unit-fleet-reachability, unit-module-skeleton]
  partition:
    outcomes: [determinate, unknown, inconclusive]
    default_policy: Any version that is not byte-equal to the compiled version, including missing and malformed values, is incompatible protocol; no operational work is attempted for that server and no other server's result is affected.
  verification:
  - id: ver-mismatch-blocks-operational-work
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/gateway/ -run TestMismatchedServerPerformsNoOperationalWork
  - id: ver-mismatch-does-not-disable-peers
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/fleet/ -run TestOneMismatchedServerDoesNotDisableOthers
  - id: ver-version-projection-registered
    tier: T2
    command: cd services && GOWORK=off go test ./gorules/ -run TestProtocolVersionManifestMatchesEveryShippedProjection
- id: contract-config-and-fleet-identity
  dimension: configuration-and-identity
  owner: comp-config-contract
  requirement_refs: [fr-003, fr-019, fr-021, fr-022, nfr-003]
  unit_refs: [unit-shared-goclient-config, unit-client-config-parity]
  adr_refs: [adr-shared-go-client-config-module]
  verification:
  - id: ver-every-go-host-loads-through-one-owner
    tier: T2
    command: cd services && GOWORK=off go test ./gorules/ -run TestClientConfigHasExactlyOneLoaderPerLanguage
  - id: ver-server-id-digest-golden-vector
    tier: T0
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestServerIdMatchesCrossLanguageGoldenVector
  - id: ver-config-never-written-and-directory-per-platform
    tier: T2
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run 'TestConfigDirectoryMatchesExistingHostsPerPlatform|TestConfigDirectoryIsNeverWritten'
  - id: ver-default-execution-never-infers-a-create-target
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestDefaultExecutionIsNeverReadAsACreateTarget
- id: contract-client-config-parity
  dimension: cross-language-conformance
  owner: comp-config-contract
  requirement_refs: [nfr-009, nfr-003, fr-021]
  unit_refs: [unit-client-config-parity, unit-shared-goclient-config, unit-server-naming-contract]
  adr_refs: [adr-shared-go-client-config-module]
  verification:
  - id: ver-expected-outcome-corpus-agrees-in-three-languages
    tier: T1
    command: ./scripts/run-verification-profile.sh pr schema
  - id: ver-go-loader-matches-the-expected-outcome-corpus
    tier: T1
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestExpectedOutcomeCorpus
  - id: ver-corpus-covers-every-per-entry-and-file-level-rule
    tier: T2
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestExpectedOutcomeCorpusCoversEveryDeclaredRule
  - id: ver-measured-divergences-are-closed-by-the-corpus
    tier: T1
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run 'TestUnknownFieldIsRejected|TestUrlCredentialsAreRejectedNotStripped'
- id: contract-config-entry-admission
  dimension: configuration-admission
  owner: comp-config-contract
  requirement_refs: [fr-030, fr-028, fr-031]
  unit_refs: [unit-server-naming-contract, unit-fleet-reachability, unit-discovery-render]
  adr_refs: [adr-server-display-name-naming-contract]
  partition:
    outcomes: [determinate, conflicting, inconclusive]
    default_policy: An entry that satisfies every per-entry rule is determinate and usable; an entry that violates a rule decidable from that entry alone is determinate and configuration-invalid; a rule violated by a group of entries jointly, such as a duplicated display name or a duplicated URL, is conflicting and makes every member of the group configuration-invalid with no winner chosen; a document whose entry list cannot be read at all — unreadable bytes, content that is not JSON, an absent or non-conforming schema_version, or a servers value that is absent or not an array — is inconclusive, is the only class that stops the host at load, and is reported as a file-level error because no entry can be named.
  verification:
  - id: ver-host-starts-and-only-the-offending-entries-are-unusable
    tier: T1
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestHostStartsAndOnlyOffendingEntriesAreInvalid
  - id: ver-unreadable-entry-list-still-stops-the-host
    tier: T0
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestUnreadableEntryListIsAFileLevelStop
  - id: ver-invalid-entry-is-a-third-vocabulary-in-discovery
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestConfigurationInvalidIsDisjointFromReachabilityAndLifecycle
  - id: ver-invalid-entry-is-never-connected-to
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/fleet/ -run TestConfigurationInvalidEntryIsNeverProbed
- id: contract-server-naming-prerequisite
  dimension: contract-evolution
  owner: comp-config-contract
  requirement_refs: [fr-028, fr-029, fr-021]
  unit_refs: [unit-server-naming-contract, unit-selector]
  adr_refs: [adr-server-display-name-naming-contract]
  partition:
    outcomes: [determinate, conflicting, inconclusive]
    default_policy: Resolution runs over every configured entry, not only the usable ones, so a qualifier never reports not-found for a server that is configured. A value matching exactly one usable entry is determinate. A value matching two or more usable entries is conflicting and exits with the ambiguous-selector code without selecting one. A value whose every match is configuration-invalid is inconclusive, exits with the usage-error code, and names each matching entry by its position and written display name together with the rule it violates — unusability outranks ambiguity, because when no candidate can be chosen the only next action is editing the configuration. A stable server identifier resolves to at most one usable entry, since two entries sharing its URL are both configuration-invalid by the duplicate-URL rule.
  verification:
  - id: ver-duplicate-display-name-flagged-per-entry-by-every-loader
    tier: T1
    command: ./scripts/run-verification-profile.sh pr schema
  - id: ver-charset-violation-flagged-identically
    tier: T0
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestDisplayNameCharsetRejection
  - id: ver-qualifier-precedence-unusable-outranks-ambiguous
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/selector/ -run TestUnusableMatchesExitUsageAndAmbiguousOnlyAppliesToUsableOnes
  - id: ver-naming-violation-names-the-entry-without-renaming
    tier: T1
    command: cd clients/goclient && GOWORK=off go test ./clientconfig/ -run TestNamingViolationReportsOffendingEntryWithoutRenaming
- id: contract-discovery-projection
  dimension: presentation-contract
  owner: comp-view
  requirement_refs: [fr-015, fr-016, fr-018, fr-019]
  unit_refs: [unit-discovery-render, unit-fleet-reachability]
  verification:
  - id: ver-rows-carry-owning-server
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestEveryRowCarriesItsServer
  - id: ver-json-separates-unreachable-from-empty
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestJSONDistinguishesUnreachableFromNoSessions
  - id: ver-display-name-is-verbatim-card-title
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestDisplayNameIsServerCardTitleVerbatim
  - id: ver-cli-never-drops-a-published-session
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestEndedSessionsArePresentedNotFiltered
  discretion:
  - id: discretion-table-rendering
    unit_ref: unit-discovery-render
    question: What column widths, alignment, and colouring does the human-readable table use?
    scope:
      files: [clients/cli/internal/view/table.go]
      component: comp-view
      visibility: private
    constraints:
    - The display-name column is never truncated, abbreviated, or elided.
    - The column set and the state label strings must not change.
    - Output content must not differ between TTY and non-TTY invocations.
    escalate_when:
    - A display name is too wide for the terminal and the layout cannot hold it without truncation.
    - Colouring or width would change output content when stdout is not a terminal.
    - A column would have to be dropped to fit.
    preserves:
      contract_refs: [contract-discovery-projection, contract-status-vocabulary]
      invariant_refs: [fr-018, fr-025]
    verification_refs: [ver-display-name-is-verbatim-card-title, ver-rows-carry-owning-server]
    difficulty_inputs:
      decision_reasoning: mechanical
      boundary_reach: private
      context_scope: files
      reversibility: trivial
      verification_strength: discriminating
      runtime_risk: normal
      coupling: independent
      grounding: evidenced
- id: contract-status-vocabulary
  dimension: shared-vocabulary
  owner: comp-view
  requirement_refs: [fr-017]
  unit_refs: [unit-status-vocabulary]
  adr_refs: [adr-cli-status-display-matrix-cli-pinning]
  verification:
  - id: ver-matrix-copy-matches-canonical
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestStatusMatrixCopyMatchesRepositoryCanonical
  - id: ver-precedence-collapses-like-existing-clients
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/view/ -run TestStatusPrecedenceMatchesSharedMatrix
- id: contract-selector-resolution
  dimension: resolution-semantics
  owner: comp-selector
  requirement_refs: [fr-020, fr-021, fr-024]
  unit_refs: [unit-selector]
  adr_refs: [adr-cli-selector-kinds-reduced-to-id-and-prefix]
  partition:
    outcomes: [determinate, unknown, inconclusive, conflicting]
    default_policy: Zero matches while at least one configured server is unreachable is inconclusive and is reported as transport failure, never as not-found; two or more matches is conflicting and never auto-selects.
  verification:
  - id: ver-declared-kind-decides-resolution
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/selector/ -run TestDeclaredKindDecidesResolution
  - id: ver-qualifier-narrows-cross-server-collision
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/selector/ -run TestServerQualifierNarrowsCollisionByNameAndByStableId
  - id: ver-unreachable-only-match-is-transport
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/selector/ -run TestUnreachableOnlyMatchIsTransportNotNotFound
  - id: ver-failure-paths-have-no-side-effect
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/selector/ -run TestResolutionFailurePathsHaveNoSideEffect
- id: contract-create-and-attach
  dimension: lifecycle-command
  owner: comp-lifecycle
  requirement_refs: [fr-022, fr-024]
  unit_refs: [unit-lifecycle-commands, unit-phase0-contract-pin]
  partition:
    outcomes: [determinate, unknown, inconclusive]
    default_policy: Creation success followed by attach failure is a distinct determinate outcome that must report the created identifier; it is never collapsed into creation failure; a creation with --no-attach is a separate determinate outcome that attempts no attach, reports the identifier, and exits zero, so it is never reported as an attach failure and an attach failure is never reported as it; an unacknowledged creation is unknown and must not report an identifier; an unresolvable agent argument or a stale profile revision fails before any request that could create a session.
  verification:
  - id: ver-create-outcomes-are-distinct-observations
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestCreateOutcomesAreDistinctObservations
  - id: ver-create-requires-explicit-server
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestCreateWithoutQualifierIsUsageErrorAndCreatesNothing
  - id: ver-unresolvable-agent-creates-no-row
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestUnresolvableAgentFailsBeforeAnyCreatingRequest
  - id: ver-attach-follows-created-identifier
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestCreateAttachesToTheSessionItJustCreated
- id: contract-explicit-terminate
  dimension: lifecycle-command
  owner: comp-lifecycle
  requirement_refs: [fr-001, fr-023]
  unit_refs: [unit-lifecycle-commands]
  partition:
    outcomes: [determinate, unknown, inconclusive]
    default_policy: Success is reported only on an acknowledgement that the termination was applied; a rejected request exits non-zero and leaves the target's observable state unchanged; an unacknowledged request is unknown and is never reported as success; the report states only what was acknowledged and never asserts a post-termination lifecycle state the CLI has not read back.
  verification:
  - id: ver-terminate-affects-only-target
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestTerminateAffectsOnlyTheTargetedSession
  - id: ver-rejected-terminate-exits-nonzero
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestRejectedTerminateExitsNonZeroAndLeavesStateUnchanged
  - id: ver-terminate-report-claims-only-acknowledgement
    tier: T0
    command: cd clients/cli && GOWORK=off go test ./internal/lifecycle/ -run TestTerminateReportAssertsNoUnreadLifecycleState
  - id: ver-terminate-is-the-only-emitter
    tier: T2
    command: cd clients/cli && GOWORK=off go test ./internal/ -run TestTerminateRequestHasExactlyOneEmissionSite
- id: contract-session-terminal-state-retention
  dimension: contract-evolution
  owner: comp-execution-plane-lifecycle
  requirement_refs: [fr-026, fr-015, fr-014]
  unit_refs: [unit-terminal-state-retention-prerequisite]
  adr_refs: [adr-cli-session-terminal-state-retention-prerequisite]
  partition:
    outcomes: [determinate, unknown, inconclusive]
    default_policy: A session that ends by explicit termination, by clean or signalled self-exit, or by frame vanish is determinate and is retained with a terminal lifecycle state and published on the lifecycle socket; a session identifier that was never created is unknown and stays not-found; the retention window and its reclamation are bounded by the same durable-snapshot owner, and no client keeps a private record to compensate.
  verification:
  - id: ver-explicit-terminate-leaves-a-terminal-row
    tier: T1
    command: cd services && GOWORK=off go test ./host/state/ -run TestStopSessionRetainsATerminalRow
  - id: ver-self-exit-paths-leave-a-terminal-row
    tier: T1
    command: cd services && GOWORK=off go test ./host/state/ -run TestIntentionalExitAndFrameVanishRetainATerminalRow
  - id: ver-terminal-transition-is-published-on-lifecycle
    tier: T1
    command: cd services && GOWORK=off go test ./server/api/ -run TestLifecycleSocketPublishesTerminalTransition
  - id: ver-ended-and-never-existed-are-distinguishable
    tier: T2
    command: cd services && GOWORK=off go test ./server/api/ -run TestEndedSessionIsDistinguishableFromUnknownIdentifier
- id: contract-module-boundary
  dimension: dependency-direction
  owner: comp-enforcement
  requirement_refs: [nfr-002, nfr-005]
  unit_refs: [unit-module-skeleton]
  adr_refs: [adr-cli-independent-go-module]
  verification:
  - id: ver-no-services-module-edge
    tier: T2
    command: cd clients/cli && GOWORK=off go list -deps ./... | grep -q 'takezoh/agent-grid/services' && exit 1 || exit 0
  - id: ver-cli-registered-in-gates
    tier: T2
    command: cd services && GOWORK=off go test ./gorules/ -run TestCLIModuleRegisteredInBuildAndVerificationEntryPoints
  discretion:
  - id: discretion-flag-parsing-implementation
    unit_ref: unit-module-skeleton
    question: Which flag and subcommand parsing mechanism does the entry point use?
    scope:
      files: [clients/cli/internal/app/root.go, clients/cli/internal/app/flags.go]
      component: comp-entry
      visibility: private
    constraints:
    - The first argument is always a verb; a selector is never accepted positionally.
    - Usage errors must terminate with exit code 2.
    escalate_when:
    - The chosen mechanism decides the usage exit code itself.
    - The chosen mechanism treats a non-verb first argument as an implicit target.
    - The chosen mechanism adds a runtime dependency that is not already accepted in the repository.
    preserves:
      contract_refs: [contract-exit-classification]
      invariant_refs: [fr-024, fr-025]
    verification_refs: [ver-exit-codes-match-the-fixed-assignment]
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: files
      reversibility: bounded
      verification_strength: discriminating
      runtime_risk: normal
      coupling: independent
      grounding: evidenced
- id: contract-external-dependency-registration
  dimension: test-harness-admission
  owner: comp-enforcement
  requirement_refs: [nfr-005, fr-002, nfr-001]
  unit_refs: [unit-fake-gateway]
  verification:
  - id: ver-dependency-triple-declared
    tier: T2
    command: ./scripts/check-harness-dependencies.sh
  - id: ver-tty-seam-drives-all-exit-paths
    tier: T1
    command: cd clients/cli && GOWORK=off go test ./internal/attach/ -run TestFakeTTYDrivesEveryExitPath
  discretion:
  - id: discretion-fake-gateway-internals
    unit_ref: unit-fake-gateway
    question: Does the fake gateway bind a real HTTP listener or wire handlers in process, and how are frames driven?
    scope:
      files: [clients/cli/internal/gateway/fakegateway/fakegateway.go]
      component: comp-fakegateway
      visibility: private
    constraints:
    - The full admission sequence and every disconnect shape must be drivable deterministically.
    - Frame shapes must match the real gateway, not a convenient variant.
    escalate_when:
    - The fake would need a frame shape the real gateway does not produce.
    - A fidelity test fails and the temptation is to weaken the assertion instead of fixing the fake.
    preserves:
      contract_refs: [contract-external-dependency-registration, contract-attach-transport-topology]
      invariant_refs: [nfr-001]
    verification_refs: [ver-dependency-triple-declared]
    difficulty_inputs:
      decision_reasoning: local_tradeoff
      boundary_reach: private
      context_scope: component
      reversibility: bounded
      verification_strength: discriminating
      runtime_risk: normal
      coupling: coupled_within_unit
      grounding: evidenced

