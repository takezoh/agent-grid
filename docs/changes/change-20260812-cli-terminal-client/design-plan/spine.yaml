  acceptance:
  - Whether raw entry removes echo and line editing on the Windows console, and how interrupt and key sequences arrive there, is recorded from a real run.
  - The Windows size-change observation mechanism is chosen from a recorded observation rather than assumed.
  - Whether the default detach key collides with the remote agents' own key handling is recorded from a real run, and the outcome is reflected in the default.
  objective: Replace the three remaining platform assumptions with observations and finish the Windows path on that basis.
  output_format: Recorded observations in the change package plus the resulting Windows implementation.
  tool_guidance: Run on a real Windows terminal and a real agent session; do not infer Windows console behaviour from the Unix implementation.
  task_boundaries: Do not change any contract as a result without recording the observation that motivated it.
  decision_closure_reason: Closes evidence-windows-console-behavior, evidence-windows-resize-source, and evidence-detach-key-chord-collision.

acceptance:
- id: ac-attach-current-screen
  criteria: Attaching to a running session shows the content that was already on its screen and continues from there, and output from any other subscribed session never appears.
  requirement_refs: [fr-007, fr-008, fr-009, nfr-004]
- id: ac-input-roundtrip
  criteria: A known input containing multi-byte characters produces the remote side's own response even when reads split it, and an interrupt reaches the remote operation without ending the CLI.
  requirement_refs: [fr-005, fr-006]
- id: ac-detach-restores-and-discards
  criteria: Characters typed immediately after the detach key appear neither in the returning shell's input line nor on reattach, echo and line editing are restored, and the session is still running afterwards.
  requirement_refs: [fr-010, fr-011, fr-002, fr-001]
- id: ac-restore-on-every-exit
  criteria: A pre-subscription failure, a catchable terminating signal, suspend and resume, end of input, and a server disconnect all leave the shell with working echo and line editing, and the pre-subscription failure leaves the terminal settings unchanged throughout; after the catchable terminating signal the session that was attached is still listed as running.
  requirement_refs: [fr-002, fr-004, fr-001]
- id: ac-lease-survives-backpressure
  criteria: A stalled standard-output reader for longer than the lease lifetime does not lose the subscription, and output resumes when the reader resumes.
  requirement_refs: [fr-013]
- id: ac-non-tty-fail-fast
  criteria: An attach with a non-terminal standard input exits non-zero without changing the invoking terminal, and the target session is unchanged.
  requirement_refs: [fr-004, fr-024]
- id: ac-disconnect-classes-distinct
  criteria: Explicit detach, lost connection, and server-side session end are told apart from what remains on screen after returning to the shell. The third class rests on the accepted terminal-state retention publishing the transition; within the second class, the reason shown is the one the execution plane published rather than a client guess, so a capacity refusal, a going-away shutdown and an unexplained drop do not read alike.
  requirement_refs: [fr-014, fr-024, fr-026, fr-032]
- id: ac-resize-reaches-remote
  criteria: Resizing during a full-screen redraw produces a redraw at the new dimensions, and no size value is silently dropped by the server.
  requirement_refs: [fr-012]
- id: ac-discovery-parity
  criteria: Each row pairs a session with its owning server, the display name and state label match what the existing graphical clients show for the same session, the name is never truncated, and rows are not filtered by creator nor removed by the client.
  requirement_refs: [fr-015, fr-017, fr-018, fr-019]
- id: ac-ended-session-remains-observable
  criteria: A session that ended by explicit termination, by clean or signalled self-exit, or by a vanished backend frame is still listed with a terminal state rather than disappearing, and an ended session is distinguishable from an identifier that never existed without any client-side memory.
  requirement_refs: [fr-026, fr-015, fr-023]
- id: ac-partial-outage
  criteria: With one server unreachable or protocol-incompatible the list is not empty, and machine-readable output alone distinguishes an unreachable server from a server with no sessions.
  requirement_refs: [fr-016, fr-019, nfr-001]
- id: ac-selector-and-failures
  criteria: Resolution follows the declared selector kind, ambiguity yields distinguishable candidates with a non-zero exit and no side effect, and the failure classes carry the fixed exit codes 2 through 6 reproducibly with an unreachable-only match classified as transport.
  requirement_refs: [fr-020, fr-021, fr-024, fr-025]
- id: ac-server-naming-and-qualifier-outcomes
  criteria: A configuration with duplicate or ill-formed display names lets every host start while marking exactly the offending entries configuration-invalid, identically in all three loaders and with the entry named rather than repaired; a qualifier matching two usable entries exits as ambiguous instead of selecting one; and a qualifier whose every match is configuration-invalid exits as a usage error naming each entry and its violated rule.
  requirement_refs: [fr-028, fr-029, fr-021]
- id: ac-config-entry-admission
  criteria: One bad entry costs one server rather than the whole client — the host starts, exactly the offending entry and its collision partners are unusable and unprobed, a duplicated URL behaves the same way as a duplicated display name, and only a document whose entry list cannot be read at all stops the host. A configuration-invalid entry is visible in both the table and the machine-readable output, in a vocabulary that shares no value with reachability and none with session lifecycle state.
  requirement_refs: [fr-030, fr-031, fr-028]
- id: ac-config-parity-across-languages
  criteria: The same configuration document produces the same accept-or-reject decision, the same per-entry admission states, the same canonical URLs and the same derived server identifiers in Go, TypeScript and C#, proven against one shared corpus in which every fixture carries its expected outcome; and no client language holds a second loader of that document.
  requirement_refs: [nfr-009, nfr-003, fr-021]
- id: ac-transport-close-is-typed
  criteria: A capacity refusal, a going-away shutdown, a backend loss, a rejected ticket, a protocol mismatch and an unexplained network drop are told apart from the public contract alone — each server-initiated departure carrying one reason from a published closed vocabulary, each pre-upgrade rejection carrying the same vocabulary in its error body, and only a departure that carries nothing being presented as unattributed. The CLI's exit class and printed reason follow that value and are never invented locally.
  requirement_refs: [fr-032, fr-014, fr-024]
- id: ac-create-outcomes-distinct
  criteria: Creation failure, creation success with attach failure, and full success are three different observations; a creation with --no-attach is a fourth, attempting no attach and exiting zero while still reporting an identifier that appears as a running row on the named server; a missing target server creates nothing and ends as a usage error; an unresolvable agent argument creates no row; and the attach that follows creation lands on the new session's freshly started screen.
  requirement_refs: [fr-022, fr-024]
- id: ac-terminate-is-explicit-only
  criteria: Only the explicitly terminated session ends, sessions that merely experienced detach, interrupt, terminal close, disconnect, or an uncatchable kill keep running, a rejected termination exits non-zero without changing the target, and the success report claims only the acknowledgement it received.
  requirement_refs: [fr-001, fr-023]
- id: ac-boundary-and-gates
  criteria: The CLI module has no dependency edge to the services module, is covered by the repository's build, test, vet, lint, verification profile, and protocol-version projection checks, and neither its runtime nor its tests write into a user configuration directory.
  requirement_refs: [nfr-002, nfr-003, nfr-005, nfr-001, fr-003]
- id: ac-concurrent-attach
  criteria: An existing graphical attach neither blocks nor gates the CLI attach and nothing in the CLI output indicates that other clients are attached; when the shared per-connection surface capacity is already exhausted the attach fails as a transport failure whose reason is the capacity code the execution plane published, which is a capacity limit of the execution plane rather than an ownership policy.
  requirement_refs: [nfr-006, fr-007, fr-024, fr-032]
- id: ac-credential-never-echoed
  criteria: An authentication failure, a protocol mismatch, and a socket dial failure each produce a reason on standard error that contains neither the bearer credential, nor the minted ticket, nor a URL carrying either, and neither value appears in the process arguments.
  requirement_refs: [fr-027, fr-003]
- id: ac-wire-shape-and-identity-pinned
  criteria: Renaming or moving a session payload field the CLI reads fails a repository gate on the server side, and a second package constructing a server-qualified identity or serialising an outbound frame fails a gate on the client side.
  requirement_refs: [nfr-008, nfr-007, fr-018]

