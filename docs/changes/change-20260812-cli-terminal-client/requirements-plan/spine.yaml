decision_points:
- id: DP-ENTRY-DISPATCH-STYLE
  decision_key: entry-dispatch-style
  layer: interaction
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-VERB-FIRST-ONLY
  option_refs:
  - OPT-VERB-FIRST-ONLY
  - OPT-POSITIONAL-SHORTHAND
  user_impact:
  - selector が verb と同じ文字列のときの予測可能性
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: 第一引数を verb に限る。selector が subcommand 名と同じ文字列でも予測可能性が崩れない
- id: DP-AMBIGUITY-INTERACTIVITY
  decision_key: ambiguity-interactivity
  layer: interaction
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-STATIC-LIST-NONZERO
  option_refs:
  - OPT-STATIC-LIST-NONZERO
  - OPT-INTERACTIVE-SELECT
  user_impact:
  - 往復回数と CLI 描画の境界
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: 曖昧な selector は候補を提示して非零終了する。CLI 側の描画を持たず手元と script で観察が一致する
- id: DP-TTY-BEHAVIOR-BRANCHING
  decision_key: tty-behavior-branching
  layer: interaction
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-UNIFORM-BEHAVIOR
  option_refs:
  - OPT-UNIFORM-BEHAVIOR
  - OPT-TTY-ADAPTIVE
  user_impact:
  - 手元と script で観察が一致するか
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: TTY 検出で挙動を分岐させない。手元で見たものと script から見えるものが一致し、明示終了の確認 prompt もこの軸に従い持たない
- id: DP-LIST-SERVER-SCOPE
  decision_key: list-server-scope
  layer: product
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-ALL-CONNECTED
  option_refs:
  - OPT-ALL-CONNECTED
  - OPT-DEFAULT-SERVER-ONLY
  user_impact:
  - 他 server の session を見落とすか
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: 接続中の全 server を母集団とする。既存 GUI の fleet 表示と同じ母集団になり server 併記が必須になる
- id: DP-LIST-LIFECYCLE-SCOPE
  decision_key: list-lifecycle-scope
  layer: product
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-INCLUDE-ENDED
  option_refs:
  - OPT-RUNNING-ONLY
  - OPT-INCLUDE-ENDED
  user_impact:
  - 明示終了をどの観察で確かめるか
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: 停止・失敗した session も一覧に出す。明示終了の効果を行の消滅ではなく状態語の変化として観察でき、接続失敗と稼働終了を取り違えない
- id: DP-SELECTOR-PRECEDENCE-ORDER
  decision_key: selector-precedence-order
  layer: product
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-EXPLICIT-MODE-FLAGS
  option_refs:
  - OPT-ID-NAME-PREFIX
  - OPT-EXPLICIT-MODE-FLAGS
  - OPT-PREFIX-FIRST
  user_impact:
  - 同じ文字列が複数種別に一致したときの誤 attach
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: selector の種別を明示指定させ、同じ文字列が複数種別に一致したときの誤 attach を構造的に消す。対話利用で冗長になる代償を受け入れる
- id: DP-SERVER-QUALIFIER-SYNTAX
  decision_key: server-qualifier-syntax
  layer: interaction
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-SEPARATE-FLAG
  option_refs:
  - OPT-EMBEDDED-SLASH
  - OPT-SEPARATE-FLAG
  - OPT-NO-QUALIFIER
  user_impact:
  - 1 行で対象 server を一意にできるか
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    rationale: server 修飾を selector とは別の指定として与える。selector 文字列に区切り文字の意味を持たせず、種別の明示指定と揃う
- id: DP-LS-DEFAULT-COLUMNS
  decision_key: ls-default-columns
  layer: presentation
  subject: default
  consultation_policy: may_default
  contract_effect: default
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-PLAN-MINIMUM-SET
  option_refs:
  - OPT-PLAN-MINIMUM-SET
  - OPT-COMPACT-WITH-WIDE-FLAG
  user_impact:
  - 情報量と狭い幅での折り返し
  provenance:
    source: user_consultation
    confidence: confirmed
    evidence_refs:
    - consultation-20260813-cli-terminal-client
    - consultation-20260814-cli-terminal-client-model-column#DP-LS-DEFAULT-COLUMNS
    - services/host/state/view/view.go 23
    - clients/ui/src/components/SessionList.tsx 83
    rationale: 元要件 §4.2 の候補列を既定表示とし、その候補列に model を含める。当初の除外根拠
      (model 相当は公開されている session 情報に存在しない) は design 段階の repository 実測で偽と判明したため
      (公開 payload の JSON tag と共有 SPA の読み取り)、除外が product decision であったことを踏まえ
      user_consultation で model 列を含めると確定した
- id: DP-JSON-SESSION-IDENTIFIER-SHAPE
  decision_key: json-session-identifier-shape
  layer: product
  subject: outcome
  consultation_policy: must_ask
  contract_effect: normative
  answer_status: answered
  validation_status: not_applicable
  selected_option_ref: OPT-STRUCTURED-PAIR
  option_refs:
  - OPT-STRUCTURED-PAIR
  - OPT-COMPOSED-STRING
  user_impact:
  - 識別子から所属 server を復元できるか
  provenance:
    source: user_consultation
