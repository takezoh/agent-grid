critique_resolutions:
- issue_ref: critique#01 DP-AMBIGUOUS-CANDIDATE-BREADTH の無権限な昇格 (blocker)
  change_class: clarify_existing_contract
  disposition: patch_contract
  provenance:
    source: repository_evidence
    confidence: confirmed
    evidence_refs:
    - critique#01
    - pass2#01
    - explore product_decisions_remaining
    rationale: patch hint を採用し decision_points と product_decisions から削除した。explore の軸文言 (所属 server と display name を併記するか ID だけか) をそのまま product_decisions_remaining へ戻し、option を起こさないことで軸の幅も狭めない。contract_effect は explore の default ではなく advisory とした。既定値を一切置かない状態を表すのは advisory であり、かつ remaining に normative/default を残すことは approval blocker として fail-closed に拒否されるためである
- issue_ref: critique#02 UAC-031 の counterexample が未確定 option を拘束 (major)
  change_class: clarify_existing_contract
  disposition: patch_contract
  provenance:
    source: critic_proposal
    confidence: confirmed
    evidence_refs:
    - critique#02
    - pass2#02
    rationale: patch hint を採用し、UAC-031 の Then と counterexample から所属 server 併記の名指しを外して「候補同士が各行だけで判別でき、その行の値で次の実行を一意に指定できる」へ一般化した。どの breadth option でも pass/fail が変わらない
- issue_ref: critique#03 UAC-035 が非判別的 (blocker)
  change_class: clarify_existing_contract
  disposition: patch_contract
  provenance:
    source: critic_proposal
    confidence: confirmed
    evidence_refs:
    - critique#03
    - pass2#03
    rationale: patch hint を採用。Given を「第一引数が実在 session の完全 ID と一致する」へ変え、Then に「その session へ attach しない」と「4 失敗種別と異なる exit code」を加えた。位置引数 shorthand 実装は attach してしまい fail する。name への言及は未測定 field を避けて ID に限定した
- issue_ref: critique#04 UAC-010 が非判別的 (blocker)
