    - pass2#05
    rationale: patch hint を採用。Given に進行中の画面を持つ既存 session を置き、Then に「attach 直後の画面が新規作成 session の起動直後の画面であり既存 session の途中経過ではない」を加えた。透過 attach 下でも attach 先の同一性が画面内容から観察できる
