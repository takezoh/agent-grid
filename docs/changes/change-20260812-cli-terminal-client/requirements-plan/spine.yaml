    - pass2#04
    rationale: patch hint を採用。Given に「打鍵文字列そのものとは異なる固有の応答が返る状態」を置き、Then から echo の選択肢を外した。local echo だけの実装は remote 由来の応答を再現できず fail する
- issue_ref: critique#05 UAC-025 が非判別的 (blocker)
