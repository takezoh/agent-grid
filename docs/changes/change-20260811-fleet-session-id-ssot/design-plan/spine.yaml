  - decision_input_ref: decision-input-implicit-local-server-fallback
    disposition: >-
      not_applicable (scope 外。到達性を実測して decision-2 の前提に接地させた)。App.tsx:80-85 の
      `return selected ?? "local"` は transport binding 専用の sentinel であり id 空間に入らない。
      実測 (静的 call graph) — (1) HTTP routing の serverId は parseSessionKey(id)?.serverId か
      fleet.initialServerId() から得るが、後者 (provider.ts:237-242 の explicitServerId) は hostedModeInfo か
      ?server= を返し、無ければ null を返す ("local" は返らず api/sessions.ts:472 が "No server selected" を throw する)。
      (2) store 行の serverId は App.tsx:134-141 が FleetSnapshot の ref.serverId から作る。
      (3) "local" の唯一の consumer は fleet.activeConnection と Connection cfg で、
      webProvider.activeConnection (provider.ts:441-452) は serverId === "local" の明示分岐で
      same-origin の /api/ws-ticket と /ws を選ぶ。(4) その endpoint はどの shipping host にも存在しない。
      (5) "local" が生じるのは activeSessionID も explicitServerId も無いときだけで、その状態では data plane 送出も起きない。
      したがって decision-2 の無退行主張は成立する。限界 — runtime 観測ではなく静的 call graph の実測。
      falsifier — 同一 origin で SPA と gateway を配信する host 構成が追加されると "local" 接続と P5 が
      同時に活性化する (decision-2 と同一の falsifier)。ARCHITECTURE.md の implicit default server 禁止への
      抵触判断は follow-up issue で起票する。
    adr_refs: [adr-fleet-session-identity-boundary-ownership]
    contract_refs: [contract-http-route-resolution, contract-wire-id-ingress]
