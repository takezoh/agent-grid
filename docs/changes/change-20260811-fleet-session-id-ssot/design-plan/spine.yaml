contracts:
  - id: contract-wire-id-egress
    dimension: integration_contract
    owner: component-wire-connection
    requirement_refs: [FR-A1, FR-A2, NFR-PERF-002]
    unit_refs: [connection-egress-intent-api, terminal-dataplane-intent-migration]
    adr_refs: [adr-fleet-session-identity-boundary-ownership]
    verification:
      - id: connection-fleet-input-outbound
        tier: T1
        command: cd clients/ui && npx vitest run src/socket/connection.fleet-input.test.ts
      - id: terminal-pane-intent-api
        tier: T1
        command: cd clients/ui && npx vitest run src/components
      - id: retry-path-uses-private-serialization
        tier: T1
        command: cd clients/ui && npx vitest run src/socket/retry.test.ts
      - id: raw-frame-escape-hatch-closed
        tier: T2
        command: cd clients/ui && npm run typecheck
    partition:
      outcomes: [determinate, unknown]
      default_policy: fail-closed。cfg.serverId 未設定は素通し。fleet key で serverId 一致なら upstream id を、bare id はそのまま載せる。serverId 不一致と decode 不能は wire に載せない。
    discretion:
      - id: discretion-upstream-parse-fast-reject
        unit_ref: connection-egress-intent-api
        question: compound key でない値に対する JSON parse 回避 (先頭文字判定 / try-catch / 事前正規表現) の実装方法。
        scope:
          files: [clients/ui/src/socket/connection.ts]
          component: component-wire-connection
          visibility: private
        escalate_when:
          - 早期棄却が bare id と compound key の判別を変える (偽陽性・偽陰性が起きうる) 場合
          - 判別規則が gateway の session id 文字集合 [A-Za-z0-9_-] の前提に依存しなくなる場合
        constraints:
          - 観察可能な結果 (送出フレームの sessionId) を変えない
          - NFR-PERF-002 を満たす
        preserves:
          contract_refs: [contract-wire-id-egress]
        verification_refs: [connection-fleet-input-outbound]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: normal
          coupling: independent
          grounding: evidenced

  - id: contract-dataplane-unresolved-drop
    dimension: failure_recovery
    owner: component-wire-connection
    requirement_refs: [FR-A3]
    unit_refs: [connection-egress-intent-api]
    adr_refs: [adr-fleet-session-identity-boundary-ownership]
    verification:
      - id: dataplane-no-throw-on-serverid-mismatch
        tier: T1
        command: cd clients/ui && npx vitest run src/socket
      - id: dataplane-drop-counter-by-reason
        tier: T1
        command: cd clients/ui && npx vitest run src/socket
      - id: dataplane-decode-failed-notifies-once
        tier: T1
        command: cd clients/ui && npx vitest run src/socket
    partition:
      outcomes: [determinate, unknown]
      default_policy: fail-closed。unknown は frame を破棄し reason 別 counter を加算する。decode-failed のときだけ (sessionId, reason) ごとに 1 lifecycle 1 件の notification を出す。server-mismatch は通知しない。例外は送出しない。
    discretion:
      - id: discretion-drop-record-dedup-structure
        unit_ref: connection-egress-intent-api
        question: drop counter と notification dedup の保持構造 (Set / Map / 単一 last-key) と getter の戻り形。
        scope:
          files: [clients/ui/src/socket/connection.ts]
          component: component-wire-connection
          visibility: private
        escalate_when:
          - dedup の寿命が Connection lifecycle 以外になる場合
          - counter の公開先を Connection getter 以外 (専用 store など) へ移す必要が生じた場合
          - reason の分類 (server-mismatch / decode-failed) を増減する必要が生じた場合
        constraints:
          - notification は同一 (sessionId, reason) で 1 lifecycle あたり 1 件を超えない
          - counter は drop のたびに加算する
          - close 後の新 lifecycle では counter が 0 から始まり notification を再び 1 件出せる
        preserves:
          contract_refs: [contract-dataplane-unresolved-drop]
        verification_refs: [dataplane-drop-counter-by-reason, dataplane-decode-failed-notifies-once]
        difficulty_inputs:
          decision_reasoning: mechanical
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: normal
          coupling: independent
          grounding: evidenced

  - id: contract-wire-id-ingress
    dimension: integration_contract
    owner: component-wire-connection
    requirement_refs: [FR-A4, NFR-PERF-001]
    unit_refs: [connection-ingress-requalification]
