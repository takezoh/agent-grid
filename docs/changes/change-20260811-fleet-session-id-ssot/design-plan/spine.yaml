          - 200 の空本文は "" であって null ではない
          - 定数は platform oracle test に従属する
        preserves:
          contract_refs: [contract-ipc-null-body-envelope]
        verification_refs: [envelope-null-body-status-mapping, envelope-platform-oracle-guard]
        difficulty_inputs:
          decision_reasoning: mechanical
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: normal
