      outcomes: [determinate, unknown, conflicting]
      default_policy: 行の権威 > id 文字列の decode > unresolved の固定順序。conflicting (行と decode の食い違い) は行の権威が勝つ。unresolved は要求を発行せず判別 union で返し throw しない (doFetch の network error 写像に吸われないため)。

