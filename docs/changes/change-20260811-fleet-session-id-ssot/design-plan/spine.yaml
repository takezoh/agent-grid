acceptance:
  - id: AC-01
    criteria: fleet-qualified なセッションで SPA の terminal に打鍵すると、gateway に upstream (bare) id を持つ {k:"i"} が届き、PTY が入力を受け取ってエコーが画面に現れる。real-stack e2e (T3) で end-to-end に観測できる。
    requirement_refs: [FR-A1, FR-A2]
  - id: AC-02
    criteria: production source (clients/ui/tsconfig.json の include 範囲) において、ClientFrame の組み立てと serializeClientFrame の呼び出しが clients/ui/src/socket/connection.ts の外に存在しない。retry.ts に import を 1 行戻すと unit suite が落ちる。
    requirement_refs: [FR-A2, FR-C1]
  - id: AC-03
    criteria: cfg.serverId と一致しない serverId を持つ key で {k:"i"} を 50 回送っても例外は 1 度も出ず、frame は 1 件も出ず、server-mismatch counter が 50 になり notification は 0 件。decode 不能な値では decode-failed counter が増え notification は 1 件だけ増える。
    requirement_refs: [FR-A3]
  - id: AC-04
    criteria: gateway から届く activity_session_id と activity event の session_id が fleet key に再修飾されて store に渡り、alias 総当たりなしで activity drawer の scope 照合が成立する。再接続 hello の bell 抑止も保たれる。
    requirement_refs: [FR-A4, FR-A7]
  - id: AC-05
    criteria: 解決不能な session id を api layer に渡しても HTTP 要求は 1 件も発行されず、呼び出し側は 1 種類の typed failure を受け取る。その失敗は Error("network") として観察されない。4 モジュールで挙動が同一であり、handle_session query param は resolver を通らない。
    requirement_refs: [FR-A5, FR-A6]
  - id: AC-06
    criteria: production source において権威 (serverId / upstreamSessionId) を持たない store 行はコンパイルできず、SessionInfo から client 専用 field が消えており、Go 生成 fixture の wire round-trip は引き続き緑である。
    requirement_refs: [FR-A7]
  - id: AC-07
    criteria: Workspace で停止・既読マーク・ログのポーリングが成功し、成功した操作が network error として報告されない。204 と 304 が例外にならず status を保って renderer に届き、envelope の body null が preload を coercion なしで素通しし、repository-preparations tracker が null で潰れない。
    requirement_refs: [FR-B1, FR-B2]
  - id: AC-08
    criteria: renderer と main の envelope の対が崩れた中間状態 (renderer が新しく main が古い) でも renderer は例外にならない。この耐性は provider.null-body-status.test.ts の legacy-empty-body ケースで判定する。
    requirement_refs: [FR-B3]
  - id: AC-09
    criteria: 所有者集合の外から identity 変換 helper または serializeClientFrame を import すると unit suite が落ち、合成した違反 source に対して gate が実際に失敗することが negative test で示され、gate が検出できない範囲 (暗黙依存 / test tree / clients/workspace) が test 自身に明記されている。
    requirement_refs: [FR-C1]
  - id: AC-10
    criteria: 打鍵経路で compound key でない値に対する JSON parse が起きず、output frame の再修飾割り当てが frame 数に比例しない。
    requirement_refs: [NFR-PERF-001, NFR-PERF-002]
  - id: AC-11
    criteria: 新規 runtime 依存が増えておらず、lint は Biome のままで、fake が real より寛容だと status parity / fidelity test が落ちる。
    requirement_refs: [NFR-DEP-001, NFR-TEST-001]
  - id: AC-12
    criteria: fix 後に {k:"r"} が SPA の実寸 (debug run 実測 cols 107 / rows 32) で wire に出て gateway に到達し、制御シーケンス ("\u001b[3~" = Delete) が verbatim で載る。既存セッションの scrollback が壊れない。
    requirement_refs: [FR-A8]

