        unit_ref: ipc-envelope-producer-null-body
        question: 型と builder を分けるか 1 関数にするか、null body status 集合を Set で持つか配列定数で持つか、export するか module private にするか。
        scope:
          files: [clients/workspace/src/shared/http-envelope.ts]
