artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete

requirements:
  - id: FR-A1
    type: functional
    priority: must
    statement: SPA が送出する全 WS frame の sessionId は upstream (bare) id である。
  - id: FR-A2
    type: functional
    priority: must
    statement: Connection の公開 API は fleet key のみを受け取り、ClientFrame の組み立てと直列化は Connection の内部に閉じる。
  - id: FR-A3
    type: functional
    priority: must
    statement: data plane の id 解決失敗は例外を送出せず frame を破棄し、reason 別に分類された観測可能な記録を残す (内部契約違反はユーザーに到達可能、正常遷移由来は診断可能な counter)。
  - id: FR-A4
    type: functional
    priority: must
    statement: gateway から到着する全ての session id 保持要素 (output frame[3] / tt / et / activity_session_id / activity event の session_id / hello・view の sessions) は store へ渡る前に単一の再修飾経路を通って fleet key へ再修飾される。
  - id: FR-A5
    type: functional
    priority: must
    statement: store と HTTP 境界の id 解決は単一 resolver が行い、api モジュールは独自の再導出を持たない。
  - id: FR-A6
    type: functional
    priority: must
    statement: 解決不能な session id に対する結果は 1 種類の typed failure であり、HTTP 要求は発行されず、その失敗は network error へ写像されない。
  - id: FR-A7
    type: functional
    priority: must
    statement: store 行は serverId と upstreamSessionId を required で保持し、session 同一性の判定は fleet key の厳密一致で行う。
  - id: FR-A8
    type: functional
    priority: must
    statement: これまで無音で捨てられていた data plane frame ({k:"r"} と制御シーケンスを含む {k:"i"}) が初めて gateway へ到達することを挙動活性化として扱い、活性化が既存セッションの表示を壊さないことを観測で確認する。
  - id: FR-B1
    type: functional
    priority: must
    statement: IPC response envelope は本文なしを body null で表し、main は null body status のときだけ null を出す。
  - id: FR-B2
    type: functional
    priority: must
    statement: FleetProvider.request は browser host と Workspace host で同一の HTTP 交換に対し観察上等価な Response を返し、body null を消費する全 consumer が null を安全に扱う。
  - id: FR-B3
    type: functional
    priority: must
    statement: envelope 型の変更は consumer-first の順序で適用され、途中状態でも renderer が壊れない。
  - id: FR-C1
    type: functional
    priority: must
    statement: identity 変換または wire frame 直列化を新たに行うモジュールが所有者集合の外に増えたとき機械的に失敗する gate が存在し、その gate 自身が発火することが示されている。
  - id: NFR-PERF-001
    type: non_functional
    priority: should
    statement: inbound hot path (FR-β07 が kHz を想定する output frame) の 1 frame あたり割り当てを現行から増やさない。再修飾は session 単位で memo 化する。
  - id: NFR-PERF-002
    type: non_functional
    priority: should
    statement: 打鍵経路の id 解決は compound key でない値に対して JSON parse を行わない。
  - id: NFR-DEP-001
    type: non_functional
    priority: must
    statement: 新規 runtime 依存を追加せず、lint は Biome のままとする。
  - id: NFR-TEST-001
    type: non_functional
    priority: must
    statement: 追加する fake は real より寛容にしない。fake が real と乖離した場合は fake を直す。

